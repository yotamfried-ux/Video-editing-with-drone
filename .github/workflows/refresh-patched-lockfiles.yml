name: Refresh patched npm lockfiles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-qa-coverage-simulations
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh web lockfile
        working-directory: web-api
        run: npm install --package-lock-only --ignore-scripts
      - name: Refresh mobile lockfile
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean installs
        run: |
          (cd web-api && npm ci --ignore-scripts)
          (cd mobile && npm ci --ignore-scripts)
      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web-api/package-lock.json mobile/package-lock.json
          git diff --cached --exit-code && exit 0
          git commit -m "fix: refresh patched npm lockfiles"
          git push origin HEAD:fix/production-qa-coverage-simulations
