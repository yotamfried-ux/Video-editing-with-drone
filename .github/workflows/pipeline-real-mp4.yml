name: Pipeline Real MP4 Renderer (isolated)

on:
  pull_request:
    paths:
      - '.github/workflows/pipeline-real-mp4.yml'
      - 'scripts/test_pipeline_real_mp4_renderer.py'
      - 'scripts/test_pipeline_track_to_render_mp4.py'
      - 'pipeline/perception/**'
      - 'pipeline/stages/editor.py'
      - 'integrations/ffmpeg.py'
      - 'pipeline/window_policy.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-real-mp4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-mp4-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system FFmpeg and lightweight Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet python-dotenv
      - name: Run actual editor on synthetic two-subject MP4 and inspect encoded frames
        env:
          PYTHONPATH: .
          SPORTREEL_CI_VIDEO_EVIDENCE_DIR: ${{ runner.temp }}/sportreel-video-evidence
        run: |
          python scripts/test_pipeline_real_mp4_renderer.py
          python scripts/test_pipeline_track_to_render_mp4.py

      - name: Verify synthetic evidence integrity before upload
        env:
          SPORTREEL_CI_VIDEO_EVIDENCE_DIR: ${{ runner.temp }}/sportreel-video-evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["SPORTREEL_CI_VIDEO_EVIDENCE_DIR"])
          assert root.is_dir() and not root.is_symlink()
          assert {p.name for p in root.iterdir()} == {"renderer", "track-to-render"}
          for suite in ("renderer", "track-to-render"):
              folder = root / suite
              assert folder.is_dir() and not folder.is_symlink()
              assert {p.name for p in folder.iterdir()} == {
                  "source.mp4", "left.mp4", "right.mp4", "qualification.json"
              }, "unexpected or missing evidence files"
              assert all(p.is_file() and not p.is_symlink() for p in folder.iterdir())
              report = json.loads((folder / "qualification.json").read_text())
              assert report["result"] == "PASS"
              assert report["suite"] == suite
              assert report["synthetic_fixture_only"] is True
              assert report["real_detector_executed"] is False
              assert report["visual_oracle_executed"] is True
              assert set(report["files"]) == {"source.mp4", "left.mp4", "right.mp4"}
              for name, expected in report["files"].items():
                  media = folder / name
                  assert expected["sha256"] == hashlib.sha256(media.read_bytes()).hexdigest()
                  assert expected["bytes"] == media.stat().st_size
                  decoded = json.loads(subprocess.run(
                      ["ffprobe", "-v", "error", "-select_streams", "v:0",
                       "-show_entries", "stream=codec_name,width,height,nb_frames",
                       "-of", "json", str(media)],
                      capture_output=True, text=True, check=True, timeout=30
                  ).stdout)["streams"][0]
                  assert decoded["codec_name"] == expected["codec"] == "h264"
                  assert int(decoded["width"]) == expected["width"]
                  assert int(decoded["height"]) == expected["height"]
                  assert int(decoded["nb_frames"]) == expected["frames"] > 0
          print("PASS: 2 synthetic suites; 6 MP4s; 2 sanitized JSON reports")
          PY
      - name: Archive synthetic MP4 source and rendered QA output
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-video-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/sportreel-video-evidence/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
