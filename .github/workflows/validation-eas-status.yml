name: Validation EAS Build Status

on:
  push:
    branches:
      - validation/eas-maestro-tool-qualification
    paths:
      - .github/workflows/validation-eas-status.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPECTED_APP_SHA: 356d5812097ba935401ecf3a145a2608cda68cb9
    steps:
      - uses: actions/checkout@v4
      - name: Setup pinned EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.9.1
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Read exact-build status
        working-directory: mobile
        shell: python
        run: |
          import json, os, subprocess
          command = [
              "eas", "build:list",
              "--platform", "android",
              "--build-profile", "preview",
              "--git-commit-hash", os.environ["EXPECTED_APP_SHA"],
              "--limit", "10",
              "--json",
              "--non-interactive",
          ]
          completed = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          token = os.environ.get("EXPO_TOKEN", "")
          if completed.returncode:
              safe = (completed.stderr or "").replace(token, "***")
              print(safe[-3000:])
              raise SystemExit(completed.returncode)
          rows = json.loads(completed.stdout)
          if not isinstance(rows, list):
              rows = [rows]
          safe_rows = []
          for row in rows:
              if not isinstance(row, dict):
                  continue
              safe_rows.append({
                  "id": row.get("id"),
                  "status": row.get("status"),
                  "platform": row.get("platform"),
                  "buildProfile": row.get("buildProfile"),
                  "gitCommitHash": row.get("gitCommitHash"),
                  "createdAt": row.get("createdAt"),
                  "updatedAt": row.get("updatedAt"),
              })
          print(json.dumps(safe_rows, indent=2, sort_keys=True))
