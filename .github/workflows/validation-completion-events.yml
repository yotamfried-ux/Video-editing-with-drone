name: Validation Completion Relay

on:
  workflow_run:
    workflows:
      - Validation Completion Event Canary
      - Validation Authenticated Android Journey
      - UPL-01 Android App Upload E2E
      - APP-02 Auth Email E2E
    types: [completed]
  push:
    branches: [ci/validation-completion-events]
    paths:
      - .github/workflows/validation-completion-events.yml
      - .github/scripts/validation-completion*
      - .github/validation-completion.json
  pull_request:
    paths:
      - .github/workflows/validation-completion-events.yml
      - .github/scripts/validation-completion*
      - .github/validation-completion.json

permissions:
  contents: read

concurrency:
  group: validation-completion-${{ github.event.workflow_run.id || github.run_id }}-${{ github.event.workflow_run.run_attempt || 1 }}
  cancel-in-progress: false

jobs:
  contracts:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test .github/scripts/validation-completion.test.cjs

  relay:
    if: >-
      github.event_name == 'workflow_run' &&
      github.repository == 'yotamfried-ux/Video-editing-with-drone' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'validation/') || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      # workflow_run executes from default branch: never checkout the tested SHA,
      # execute its code, download its artifacts, or restore its caches here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const {relay} = require('./.github/scripts/validation-completion.cjs');
            const result = await relay({github, context, core});
            const fs = require('node:fs');
            fs.writeFileSync(process.env.RUNNER_TEMP + '/completion-relay.json', JSON.stringify(result, null, 2));
      - uses: actions/upload-artifact@v4
        with:
          name: completion-relay-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/completion-relay.json
          if-no-files-found: error
          retention-days: 30
