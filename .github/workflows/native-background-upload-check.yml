name: Native Background Upload Check

# Compiles the Android project and runs the native background-upload unit tests
# (durable store, multipart engine, HTTP contract, progress summary) on a runner
# that has the Android SDK. Product failures show up as failing JUnit tests;
# Gradle/SDK resolution problems show up before any test starts.

on:
  push:
    paths:
      - 'mobile/modules/sportreel-source-reader/**'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'scripts/run_native_upload_unit_tests.sh'
      - '.github/workflows/native-background-upload-check.yml'
  pull_request:
    paths:
      - 'mobile/modules/sportreel-source-reader/**'
      - 'scripts/run_native_upload_unit_tests.sh'
      - '.github/workflows/native-background-upload-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvm-core:
    name: pure-JVM engine tests (no Android SDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Fetch kotlinc and test jars
        run: |
          mkdir -p "$RUNNER_TEMP/kt" && cd "$RUNNER_TEMP/kt"
          curl -fsSL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlinc.zip
          M=https://repo.maven.apache.org/maven2
          curl -fsSL --retry 5 -o junit.jar "$M/junit/junit/4.13.2/junit-4.13.2.jar"
          curl -fsSL --retry 5 -o hamcrest.jar "$M/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar"
          curl -fsSL --retry 5 -o json.jar "$M/org/json/json/20231013/json-20231013.jar"
      - name: Run JVM tests
        run: |
          K="$RUNNER_TEMP/kt"
          KOTLINC="$K/kotlinc/bin/kotlinc" NATIVE_TEST_JARS="$K/junit.jar:$K/hamcrest.jar:$K/json.jar" \
            scripts/run_native_upload_unit_tests.sh

  gradle:
    name: expo prebuild + Gradle unit tests + assembleDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Expo prebuild
        working-directory: mobile
        env:
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Resolve native module
        working-directory: mobile
        run: npx expo-modules-autolinking resolve --platform android | grep -i sportreel
      - name: Native unit tests + compile
        working-directory: mobile/android
        run: ./gradlew :sportreel-source-reader:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-background-upload-test-reports-${{ github.run_id }}
          path: mobile/modules/sportreel-source-reader/android/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
