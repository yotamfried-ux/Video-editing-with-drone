name: GCP WIF Qualification

on:
  push:
    branches:
      - validation/gcp-wif-qualification
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: sportreel-test-lab
          workload_identity_provider: projects/518907714664/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: sportreel-github-ci@sportreel-test-lab.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify federated identity and project
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_ACCOUNT="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          test "$ACTIVE_ACCOUNT" = "sportreel-github-ci@sportreel-test-lab.iam.gserviceaccount.com"
          PROJECT_ID="$(gcloud config get-value project 2>/dev/null)"
          test "$PROJECT_ID" = "sportreel-test-lab"
          PROJECT_NUMBER="$(gcloud projects describe sportreel-test-lab --format='value(projectNumber)')"
          test "$PROJECT_NUMBER" = "518907714664"
          gcloud auth print-access-token >/dev/null
          echo "WIF_OK account=$ACTIVE_ACCOUNT project=$PROJECT_ID project_number=$PROJECT_NUMBER"

      - name: Qualify Firebase Test Lab API and device catalog
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android models list --format='value(id)' --limit=5 | tee /tmp/models.txt
          test -s /tmp/models.txt
          gcloud firebase test android versions list --format='value(id)' --limit=5 | tee /tmp/versions.txt
          test -s /tmp/versions.txt
          echo "FTL_CATALOG_OK"

      - name: Download proven SportReel APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -o /tmp/sportreel.zip             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10601326160/zip"
          unzip -q /tmp/sportreel.zip -d /tmp/sportreel-artifact
          APK="$(find /tmp/sportreel-artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" /tmp/sportreel.apk
          ls -lh /tmp/sportreel.apk
          echo "APK_OK"

      - name: Firebase Test Lab Robo smoke test
        shell: bash
        run: |
          set -euo pipefail
          gcloud firebase test android run             --type robo             --app /tmp/sportreel.apk             --device model=MediumPhone.arm,version=35,locale=en,orientation=portrait             --timeout 2m             --client-details matrixLabel="SportReel-WIF-qualification"
