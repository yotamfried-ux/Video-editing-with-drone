name: Clean Video Storage

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inventory (read-only) or delete'
        required: true
        default: 'inventory'
        type: choice
        options: [inventory, delete]
      confirm:
        description: 'For delete, type DELETE_OLD_VIDEOS'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check boto3 supabase python-dotenv
      - name: Inventory / delete old video objects via backend APIs
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM_DELETE_OLD_VIDEOS: ${{ inputs.confirm }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          EVIDENCE_PATH: ${{ runner.temp }}/video-storage-evidence.json
        run: python scripts/clean_video_storage.py
      - name: Upload evidence (object keys and sizes only, no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-storage-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/video-storage-evidence.json
          if-no-files-found: warn
          retention-days: 30
