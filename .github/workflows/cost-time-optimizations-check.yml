      - '.github/workflows/cost-time-optimizations-check.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies (no detector, no network)
        run: python -m pip install --disable-pip-version-check python-dotenv google-genai langsmith httplib2 google-api-python-client google-auth-oauthlib
      - name: Install ffmpeg once (runner mirror with a time limit, else archive.ubuntu.com directly)
        # 2026-11-11: the runner's apt mirror list failed ("Temporary failure"), apt-get hung and the job timed out.
        # The fallback reads the same noble packages (ffmpeg 6.1, as in production) straight from Ubuntu.
        # Every later step skips its own install when ffmpeg is already present.
        run: |
          apt_install() {
            timeout 150 sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20 \
              && timeout 240 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg
          }
          if ! command -v ffmpeg >/dev/null 2>&1 && ! apt_install; then
            echo "runner apt mirror unavailable; using archive.ubuntu.com directly"
            sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            apt_install
          fi
          ffmpeg -version | head -1
      - name: Cost/time optimizations contract
        env:
          PYTHONPATH: .
        run: python scripts/test_cost_time_optimizations_contract.py
      - name: One reel per athlete (verified clusters)
        env:
          PYTHONPATH: .
        run: python scripts/test_verified_cluster_merge_contract.py
      - name: A/B comparison logic
        env:
          PYTHONPATH: .
        run: python scripts/test_ab_action_selection_contract.py
      - name: Render preset, parallel verified Reset copy, run diagnostics
        env:
          PYTHONPATH: .
        run: python scripts/test_render_reset_diagnostics_contract.py
      - name: Ledger overlap matching
        env:
          PYTHONPATH: .
        run: python scripts/test_ledger_overlap_matching_contract.py
      - name: QA findings reach the database and the gate error
        env:
          PYTHONPATH: .
        run: python scripts/test_qa_findings_contract.py
      - name: Follow-crop simulation (real ffmpeg, 4K source)
        env:
          PYTHONPATH: .
        run: python scripts/test_follow_crop_simulation.py
      - name: Single-decode perception (real ffmpeg + OpenCV, frame-exact intermediate, bound Gemini proxy)
        env:
          PYTHONPATH: .
        run: |
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg; }
          python -m pip install --disable-pip-version-check opencv-python-headless numpy
          python scripts/test_single_decode_perception_contract.py
      - name: Single-pass render (one ffmpeg run / one lossy encode per reel, exact timeline, safe fallback)
        env:
          PYTHONPATH: .
        run: python scripts/test_single_pass_render_contract.py
      - name: Pipeline simulation (bootstrap stack -> compile_multi_source_reel -> one 4K/30 render pass + QA scope)
        env:
          PYTHONPATH: .
        run: python scripts/test_single_pass_pipeline_simulation.py
      - name: OpenVINO CPU runtime (cached full-precision conversion, PyTorch fallback)
        env:
          PYTHONPATH: .
        run: python scripts/test_cpu_runtime_contract.py
      - name: Source-window dedup is accounted for (run 42814819534 regression)
        env:
          PYTHONPATH: .
        run: python scripts/test_source_window_dedup_accountability_contract.py
      - name: Evidence-backed ride ends are not "inferred from fragments" (run 42814819534 regression)
        env:
          PYTHONPATH: .
        run: python scripts/test_ride_boundary_evidence_contract.py
      - name: Source-evidence QA labels the draft and each source video (run 42814819534 regression)
        env:
          PYTHONPATH: .
        run: |
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg; }
          python scripts/test_qa_evidence_video_labels_contract.py
      - name: A ride the camera stopped recording is a note, not a blocking PREMATURE_CUT (run 42891165218)
        env:
          PYTHONPATH: .
        run: |
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg; }
          python scripts/test_qa_recording_limited_contract.py
      - name: A single good ride is a complete reel; final QA passes on the deliverable score
        env:
          PYTHONPATH: .
        run: python scripts/test_qa_deliverable_standard_contract.py
      - name: Athletes split across clips with agreeing descriptions get a side-by-side merge check
        env:
          PYTHONPATH: .
        run: python scripts/test_identity_merge_check_contract.py
      - name: People who moved but got no event get a second look; unusual moments (tandem, child) count
        env:
          PYTHONPATH: .
        run: |
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg; }
          python -m pip install --disable-pip-version-check "Pillow>=12.3.0"
          python scripts/test_missed_moment_rescue_contract.py
      - name: Render timeout scales with the reel; disk cleanup overlaps setup
        env:
          PYTHONPATH: .
        run: python scripts/test_runtime_setup_contract.py
      - name: QA fallback sees the reel fps; Gemini 5xx is retried (run 42857524999 regression)
        env:
          PYTHONPATH: .
        run: |
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg; }
          python scripts/test_qa_fallback_specs_contract.py
      - name: Actions ending within 2 s of the recording end run to it (run 42857524999 QA PREMATURE_CUT)
        env:
          PYTHONPATH: .
        run: |
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg; }
          python scripts/test_recording_end_tail_contract.py
      - name: A ride's cut opens on the catch and pop-up (setup_start), not on a standing athlete (catalog, run 43203677423)
        env:
          PYTHONPATH: .
        run: python scripts/test_setup_lead_in_contract.py
      - name: A long-sleeved wetsuit top and a full wetsuit are two athletes (catalog 0074/0151, run 43203677423)
        env:
          PYTHONPATH: .
        run: python scripts/test_wetsuit_coverage_identity_contract.py
      - name: An unnamed top is no sleeve conflict (catalog 0070/0108, run 43303438106)
        env:
          PYTHONPATH: scripts:.
        run: python scripts/test_generic_top_identity_contract.py
      - name: Sources download concurrently, admitted in order
        env:
          PYTHONPATH: .
        run: python scripts/test_parallel_source_download_contract.py
      - name: Cached-perception runs reuse the persisted QA evidence copy (no 4K re-decode for QA)
        env:
          PYTHONPATH: .
        run: |
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg; }
          python -m pip install --disable-pip-version-check opencv-python-headless numpy
          python scripts/test_persisted_qa_evidence_contract.py
      - name: Identity clustering uploads/deletes thumbnails concurrently, request order unchanged
        env:
          PYTHONPATH: .
        run: python scripts/test_identity_files_api_concurrency_contract.py
