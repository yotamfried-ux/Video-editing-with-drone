name: Cost/Time Optimizations Check

on:
  pull_request:
    paths:
      - 'integrations/llm_cache.py'
      - 'integrations/llm_cost.py'
      - 'integrations/stage_timer.py'
      - 'integrations/gemini.py'
      - 'pipeline/activity_window.py'
      - 'pipeline/real_identity_gate.py'
      - 'pipeline/identity_failsafe.py'
      - 'pipeline/stages/identity.py'
      - 'pipeline/stages/analyzer.py'
      - 'pipeline/orchestrator.py'
      - 'pipeline/selector_candidate_runtime.py'
      - 'pipeline/source_evidence.py'
      - 'pipeline/source_evidence_runner.py'
      - 'scripts/ab_action_selection.py'
      - 'scripts/test_cost_time_optimizations_contract.py'
      - 'scripts/test_verified_cluster_merge_contract.py'
      - 'scripts/test_ab_action_selection_contract.py'
      - 'scripts/test_render_reset_diagnostics_contract.py'
      - 'scripts/test_ledger_overlap_matching_contract.py'
      - 'scripts/print_run_diagnostics.py'
      - 'scripts/build_candidate_decision_ledger.py'
      - 'scripts/reset_and_rerun.py'
      - 'integrations/r2_storage.py'
      - 'pipeline/quality_preserving_framing.py'
      - 'pipeline/publishable_reel_policy.py'
      - 'scripts/publishable_manifest_contract.py'
      - 'scripts/test_follow_crop_simulation.py'
      - 'scripts/test_qa_findings_contract.py'
      - 'scripts/run_pipeline_with_diagnostics.sh'
      - '.github/workflows/pipeline-run.yml'
      - '.github/workflows/cost-time-optimizations-check.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies (no detector, no network)
        run: python -m pip install --disable-pip-version-check python-dotenv google-genai langsmith httplib2 google-api-python-client google-auth-oauthlib
      - name: Cost/time optimizations contract
        env:
          PYTHONPATH: .
        run: python scripts/test_cost_time_optimizations_contract.py
      - name: One reel per athlete (verified clusters)
        env:
          PYTHONPATH: .
        run: python scripts/test_verified_cluster_merge_contract.py
      - name: A/B comparison logic
        env:
          PYTHONPATH: .
        run: python scripts/test_ab_action_selection_contract.py
      - name: Render preset, parallel verified Reset copy, run diagnostics
        env:
          PYTHONPATH: .
        run: python scripts/test_render_reset_diagnostics_contract.py
      - name: Ledger overlap matching
        env:
          PYTHONPATH: .
        run: python scripts/test_ledger_overlap_matching_contract.py
      - name: QA findings reach the database and the gate error
        env:
          PYTHONPATH: .
        run: python scripts/test_qa_findings_contract.py
      - name: Follow-crop simulation (real ffmpeg, 4K source)
        env:
          PYTHONPATH: .
        run: python scripts/test_follow_crop_simulation.py
