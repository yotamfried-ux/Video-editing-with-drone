name: Mobile Check

on:
  pull_request:
    paths:
      - 'mobile/**'
      # contracts.drift.ts type-checks the mobile mirror against this file.
      - 'web-api/src/types/operator-contracts.ts'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run type-check
