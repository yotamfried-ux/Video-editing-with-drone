name: Upload Foundation Production Release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type RELEASE to run the protected production release gate from main'
        required: true
        type: string
      confirm_biometric_removal:
        description: 'Type REMOVE_BIOMETRICS to approve the tracked destructive biometric-removal migration when pending'
        required: true
        type: string
      production_domain:
        description: 'Production domain without path'
        required: true
        default: 'video-editing-with-drone.vercel.app'
        type: string
      browser_upload_origin:
        description: 'Optional exact browser origin that requires R2 PUT + exposed ETag; leave empty for native Android only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: upload-foundation-production-release
  cancel-in-progress: false

env:
  VERCEL_REQUIRED_ENV_NAMES: SUPABASE_URL,SUPABASE_SERVICE_KEY,OPERATOR_SECRET,GITHUB_REPO,GITHUB_DISPATCH_TOKEN,STORAGE_BACKEND,R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET

jobs:
  preflight:
    name: Verify release inputs and required configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      PRODUCTION_OPERATOR_SECRET: ${{ secrets.PRODUCTION_OPERATOR_SECRET }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BROWSER_UPLOAD_ORIGIN: ${{ inputs.browser_upload_origin }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify required secret and variable names without printing values
        run: |
          set -euo pipefail
          [[ "${{ github.ref }}" == 'refs/heads/main' ]] || { echo 'Release must run from main.' >&2; exit 1; }
          [[ "${{ inputs.confirm_release }}" == 'RELEASE' ]] || { echo 'confirm_release must equal RELEASE.' >&2; exit 1; }
          [[ "${{ inputs.confirm_biometric_removal }}" == 'REMOVE_BIOMETRICS' ]] || { echo 'confirm_biometric_removal must equal REMOVE_BIOMETRICS.' >&2; exit 1; }
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]] || { echo 'Checked-out commit does not match GITHUB_SHA.' >&2; exit 1; }

          required=(
            SUPABASE_DB_URL
            R2_ACCOUNT_ID
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            R2_BUCKET
            VERCEL_TOKEN
            VERCEL_PROJECT_ID
            PRODUCTION_OPERATOR_SECRET
            EXPO_TOKEN
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ -n "${R2_BROWSER_UPLOAD_ORIGIN}" && -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            missing+=(CLOUDFLARE_API_TOKEN)
          fi
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secret/variable names: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          python - <<'PY'
          import json, os
          from pathlib import Path
          names = [
              'SUPABASE_DB_URL', 'R2_ACCOUNT_ID', 'R2_ACCESS_KEY_ID',
              'R2_SECRET_ACCESS_KEY', 'R2_BUCKET', 'VERCEL_TOKEN',
              'VERCEL_PROJECT_ID', 'PRODUCTION_OPERATOR_SECRET', 'EXPO_TOKEN',
          ]
          if os.environ.get('R2_BROWSER_UPLOAD_ORIGIN'):
              names.append('CLOUDFLARE_API_TOKEN')
          evidence = {
              'protocol': 'production_release_preflight_v1',
              'commit': os.environ['GITHUB_SHA'],
              'ref': os.environ['GITHUB_REF'],
              'required_names_present': sorted(names),
              'secret_values_recorded': False,
              'browser_upload_origin_configured': bool(os.environ.get('R2_BROWSER_UPLOAD_ORIGIN')),
              'result': 'success',
          }
          Path(os.environ['RUNNER_TEMP'], 'release-preflight.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8'
          )
          PY

      - name: Publish preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-release-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/release-preflight.json
          if-no-files-found: error
          retention-days: 30

  verify-production-deployment:
    name: Verify Vercel production commit, alias, and environment names
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify production deployment and alias
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PRODUCTION_DOMAIN: ${{ inputs.production_domain }}
          EXPECTED_MINIMUM_COMMIT: ${{ github.sha }}
          VERCEL_REQUIRED_ENV_NAMES: ${{ env.VERCEL_REQUIRED_ENV_NAMES }}
          VERCEL_EVIDENCE_PATH: ${{ runner.temp }}/vercel-production-evidence.json
        run: python scripts/verify_production_deployment.py
      - name: Publish Vercel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-production-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/vercel-production-evidence.json
          if-no-files-found: error
          retention-days: 30

  migrate-and-verify:
    name: Apply tracked migrations and verify live Supabase schema
    needs: verify-production-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CONFIRM_BIOMETRIC_REMOVAL: ${{ inputs.confirm_biometric_removal }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Apply release migrations in dependency order
        env:
          MIGRATION_EVIDENCE_PATH: ${{ runner.temp }}/migration-apply-evidence.json
        run: python scripts/apply_upload_release_migrations.py
      - name: Prove migration rerun is stable and has no pending files
        run: >-
          python scripts/apply_upload_release_migrations.py
          --check-only
          --evidence "${RUNNER_TEMP}/migration-idempotency-evidence.json"
      - name: Verify tables, columns, data types, constraints, indexes, foreign keys, RLS, policies, grants, RPCs, and biometric removal
        run: |
          set -euo pipefail
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/verify_upload_release_schema.sql \
            | tee "$RUNNER_TEMP/upload-release-schema-evidence.txt"
          test -s "$RUNNER_TEMP/upload-release-schema-evidence.txt"
          if grep -q '=false$' "$RUNNER_TEMP/upload-release-schema-evidence.txt"; then
            echo 'Upload release schema verifier returned false.' >&2
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -At -F= -f supabase/verify_schema.sql \
            | tee "$RUNNER_TEMP/core-schema-evidence.txt"
          test -s "$RUNNER_TEMP/core-schema-evidence.txt"
          if grep -q '=f$' "$RUNNER_TEMP/core-schema-evidence.txt"; then
            echo 'Core schema or biometric-removal verifier returned false.' >&2
            exit 1
          fi
      - name: Verify registration, login, profile, Discover, checkout, support, and delivery have no removed biometric dependencies
        env:
          NO_BIOMETRIC_EVIDENCE_PATH: ${{ runner.temp }}/no-biometric-runtime-evidence.json
        run: python scripts/verify_no_biometric_runtime_dependencies.py
      - name: Publish Supabase migration and schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-release-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/migration-apply-evidence.json
            ${{ runner.temp }}/migration-idempotency-evidence.json
            ${{ runner.temp }}/upload-release-schema-evidence.txt
            ${{ runner.temp }}/core-schema-evidence.txt
            ${{ runner.temp }}/no-biometric-runtime-evidence.json
          if-no-files-found: error
          retention-days: 30

  real-r2-probe:
    name: Verify real R2 multipart, ETags, CORS scope, hashes, and cleanup
    needs: migrate-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-api/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install --disable-pip-version-check boto3 requests
      - name: Verify narrow R2 CORS only when a browser origin is configured
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BROWSER_UPLOAD_ORIGIN: ${{ inputs.browser_upload_origin }}
          R2_CORS_EVIDENCE_PATH: ${{ runner.temp }}/r2-cors-evidence.json
        run: python scripts/verify_r2_cors.py
      - name: Compile the actual Web API R2 signer
        working-directory: web-api
        run: |
          set -euo pipefail
          npm ci
          npx tsc src/lib/r2-storage.ts \
            --target ES2022 \
            --module commonjs \
            --moduleResolution node \
            --esModuleInterop \
            --skipLibCheck \
            --rootDir src/lib \
            --outDir "$RUNNER_TEMP/web-api-r2-signer"
          test -f "$RUNNER_TEMP/web-api-r2-signer/r2-storage.js"
      - name: Probe R2 through SportReel Web API signing code
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_STORAGE_MODULE: ${{ runner.temp }}/web-api-r2-signer/r2-storage.js
          R2_WEB_API_EVIDENCE_PATH: ${{ runner.temp }}/web-api-r2-signer-evidence.json
        run: node scripts/test_real_web_api_r2_signer.cjs
      - name: Remove and verify absence of the Web API signer probe object
        if: always()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_WEB_API_EVIDENCE_PATH: ${{ runner.temp }}/web-api-r2-signer-evidence.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError

          evidence_path = Path(os.environ['R2_WEB_API_EVIDENCE_PATH'])
          if not evidence_path.exists():
              raise RuntimeError('Web API signer evidence file is missing')
          evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          key = str(evidence.get('key') or '').strip()
          if not key:
              raise RuntimeError('Web API signer evidence contains no object key')
          endpoint = os.environ.get('R2_ENDPOINT_URL', '').strip().rstrip('/')
          if not endpoint:
              endpoint = f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com"
          client = boto3.client(
              's3', endpoint_url=endpoint,
              aws_access_key_id=os.environ['R2_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['R2_SECRET_ACCESS_KEY'],
              region_name='auto',
              config=Config(signature_version='s3v4', retries={'max_attempts': 3, 'mode': 'standard'}),
          )
          errors = []
          try:
              client.delete_object(Bucket=os.environ['R2_BUCKET'], Key=key)
              try:
                  client.head_object(Bucket=os.environ['R2_BUCKET'], Key=key)
                  errors.append('object still exists after delete')
              except ClientError as error:
                  status = error.response.get('ResponseMetadata', {}).get('HTTPStatusCode')
                  if status != 404:
                      errors.append(f'post-delete HEAD returned {status}')
          except Exception as error:
              errors.append(f'{type(error).__name__}: {error}')
          evidence['object_cleanup'] = 'confirmed' if not errors else 'failed'
          evidence['object_cleanup_errors'] = errors
          evidence_path.write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')
          if errors:
              raise RuntimeError('; '.join(errors))
          PY
      - name: Upload, retry, complete, hash-check, and remove independent probe object
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PROBE_SIZE_MIB: '11'
          R2_PROBE_EVIDENCE_PATH: ${{ runner.temp }}/r2-multipart-evidence.json
        run: python scripts/test_real_r2_multipart_upload.py
      - name: Publish R2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-release-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r2-cors-evidence.json
            ${{ runner.temp }}/web-api-r2-signer-evidence.json
            ${{ runner.temp }}/r2-multipart-evidence.json
          if-no-files-found: error
          retention-days: 30

  production-api-smoke:
    name: Smoke production upload API and durable cleanup
    needs: real-r2-probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install production smoke dependencies
        run: python -m pip install --disable-pip-version-check requests 'psycopg[binary]'
      - name: Run authenticated, negative, correlation, abort, DB, and cleanup smoke
        env:
          PRODUCTION_API_BASE_URL: https://${{ inputs.production_domain }}
          PRODUCTION_OPERATOR_SECRET: ${{ secrets.PRODUCTION_OPERATOR_SECRET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PRODUCTION_SMOKE_EVIDENCE_PATH: ${{ runner.temp }}/production-upload-smoke.json
        run: python scripts/test_production_upload_api_smoke.py
      - name: Publish production API smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-upload-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/production-upload-smoke.json
          if-no-files-found: error
          retention-days: 30

  build-android-preview:
    name: Build exact installable Android preview with native source reader
    needs: production-api-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps
      - name: Verify native module is included before build
        working-directory: mobile
        run: |
          set -euo pipefail
          npx expo-modules-autolinking resolve --platform android > "$RUNNER_TEMP/expo-modules-android.json"
          grep -q 'SportReelSourceReaderModule' "$RUNNER_TEMP/expo-modules-android.json"
      - name: Setup EAS from Expo's official GitHub Action
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.8.1
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build Android preview in EAS and capture build ID
        id: eas-build
        working-directory: mobile
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --wait --json \
            > "$RUNNER_TEMP/eas-build.json"
          BUILD_ID=$(python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ['RUNNER_TEMP'], 'eas-build.json').read_text())
          row = payload[0] if isinstance(payload, list) else payload
          value = str(row.get('id') or '').strip()
          if not value:
              raise SystemExit('EAS JSON has no build ID')
          print(value)
          PY
          )
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
      - name: Refresh exact EAS build metadata
        working-directory: mobile
        run: eas build:view "${{ steps.eas-build.outputs.build_id }}" --json > "$RUNNER_TEMP/eas-build.json"
      - name: Download exact EAS APK by build ID
        working-directory: mobile
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eas-download"
          cd "$RUNNER_TEMP/eas-download"
          eas build:download --build-id "${{ steps.eas-build.outputs.build_id }}"
          APK=$(find . -type f -name '*.apk' -print -quit)
          test -n "$APK"
          cp "$APK" "$RUNNER_TEMP/sportreel-upload-ready.apk"
      - name: Verify build ID, commit, profile, runtime, channel, native identity, and APK hash
        run: >-
          python scripts/record_eas_build_evidence.py
          --build-json "$RUNNER_TEMP/eas-build.json"
          --apk "$RUNNER_TEMP/sportreel-upload-ready.apk"
          --evidence "$RUNNER_TEMP/eas-build-evidence.json"
      - name: Publish exact APK and EAS evidence
        uses: actions/upload-artifact@v4
        with:
          name: sportreel-upload-ready-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sportreel-upload-ready.apk
            ${{ runner.temp }}/eas-build-evidence.json
            ${{ runner.temp }}/expo-modules-android.json
          if-no-files-found: error
          retention-days: 30
