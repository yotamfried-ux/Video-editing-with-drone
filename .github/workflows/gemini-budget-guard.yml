name: Gemini 10 ILS Budget Guard (isolated)

on:
  pull_request:
    paths:
      - 'scripts/test_gemini_budget_guard.py'
      - 'scripts/test_gemini_budget_guard_contract.py'
      - '.github/workflows/gemini-budget-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify conservative cost preflight contract
        env:
          PYTHONPATH: scripts
        run: python scripts/test_gemini_budget_guard_contract.py
