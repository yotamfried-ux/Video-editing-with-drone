name: Android Phone-ready Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/record_eas_build_evidence.py'
      - '.github/workflows/android-phone-ready-build.yml'

permissions:
  contents: read

concurrency:
  group: android-phone-ready-${{ github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build verified installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Verify native source reader is linked
        working-directory: mobile
        run: |
          set -euo pipefail
          npx expo-modules-autolinking resolve --platform android > "$RUNNER_TEMP/expo-modules-android.json"
          grep -q 'SportReelSourceReaderModule' "$RUNNER_TEMP/expo-modules-android.json"

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 18.9.1
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify pinned EAS CLI
        working-directory: mobile
        run: |
          set -euo pipefail
          EAS_VERSION=$(eas --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          test "$EAS_VERSION" = '18.9.1'
          eas build:download --help | grep -q -- '--build-id'
          eas build --help | grep -q -- '--no-wait'

      - name: Start exact Android preview build
        id: eas-build
        working-directory: mobile
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --no-wait --json \
            > "$RUNNER_TEMP/eas-build-start.json"
          BUILD_ID=$(python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "eas-build-start.json").read_text())
          row = payload[0] if isinstance(payload, list) else payload
          value = str(row.get("id") or "").strip()
          if not value:
              raise SystemExit("EAS JSON has no build ID")
          print(value)
          PY
          )
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Started EAS build $BUILD_ID"

      - name: Poll exact EAS build to terminal state
        working-directory: mobile
        env:
          BUILD_ID: ${{ steps.eas-build.outputs.build_id }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 9000 ))
          while true; do
            eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/eas-build.json"
            STATUS=$(python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ["RUNNER_TEMP"], "eas-build.json").read_text())
          print(str(payload.get("status") or "").upper())
          PY
            )
            echo "EAS build $BUILD_ID status: $STATUS"
            case "$STATUS" in
              FINISHED) break ;;
              ERRORED|CANCELED|CANCELLED)
                echo "EAS build reached terminal failure state: $STATUS" >&2
                exit 1
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "Timed out waiting 150 minutes for EAS build $BUILD_ID; remote build was not weakened or replaced." >&2
              exit 1
            fi
            sleep 60
          done

      - name: Download exact APK by build ID
        working-directory: mobile
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/sportreel-phone-ready.apk"
          rm -f "$DEST"
          eas build:download \
            --build-id "${{ steps.eas-build.outputs.build_id }}" \
            --path "$DEST" \
            --non-interactive
          test -s "$DEST"

      - name: Verify build identity and APK hash
        run: |
          python scripts/record_eas_build_evidence.py \
            --build-json "$RUNNER_TEMP/eas-build.json" \
            --apk "$RUNNER_TEMP/sportreel-phone-ready.apk" \
            --evidence "$RUNNER_TEMP/eas-build-evidence.json"
          test -s "$RUNNER_TEMP/eas-build-evidence.json"

      - name: Publish phone-ready APK
        uses: actions/upload-artifact@v4
        with:
          name: sportreel-phone-ready-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sportreel-phone-ready.apk
            ${{ runner.temp }}/eas-build-evidence.json
            ${{ runner.temp }}/expo-modules-android.json
          if-no-files-found: error
          retention-days: 30
