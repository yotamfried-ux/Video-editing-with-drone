name: Sync Production Operator Auth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/operator-secret-sync.yml'

permissions:
  contents: read
  actions: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_uUUpzY1J0BvqvtYwemoFoBdm
      VERCEL_PROJECT_ID: prj_ucNsOHpdQBum3FHgED5ZPuGimrTq
      VERCEL_SCOPE: yotamfried-7101s-projects
      API_BASE_URL: https://video-editing-with-drone.vercel.app
      OPERATOR_SECRET: ${{ secrets.PRODUCTION_OPERATOR_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate required credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPERATOR_SECRET" || { echo 'PRODUCTION_OPERATOR_SECRET is missing'; exit 2; }
          test -n "$VERCEL_TOKEN" || { echo 'VERCEL_TOKEN is missing'; exit 2; }
          echo "::add-mask::$OPERATOR_SECRET"

      - name: Link Vercel project locally
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Synchronize production OPERATOR_SECRET
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$OPERATOR_SECRET"
          npx --yes vercel@latest env update OPERATOR_SECRET production \
            --value "$OPERATOR_SECRET" \
            --visibility secret \
            --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_SCOPE"

      - name: Redeploy production with synchronized environment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest deploy --prod --yes \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_SCOPE"

      - name: Verify production operator authentication
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$OPERATOR_SECRET"
          status=$(curl -sS -o "$RUNNER_TEMP/operator-drafts.json" -w '%{http_code}' \
            -H "x-operator-secret: $OPERATOR_SECRET" \
            "$API_BASE_URL/api/operator/drafts")
          if [ "$status" != '200' ]; then
            echo "Production operator auth verification failed with HTTP $status"
            python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ['RUNNER_TEMP'], 'operator-drafts.json')
          try:
              body = json.load(open(p))
              print({'error': body.get('error') or body.get('message') or 'request failed'})
          except Exception:
              print('Production endpoint returned a non-JSON failure response')
          PY
            exit 1
          fi
          echo 'Production operator authentication verified (HTTP 200).'

      - name: Start full Android qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run full-android-app-qualification.yml --ref main
