name: LLM Cost Logging Check

on:
  pull_request:
    paths:
      - 'integrations/llm_cost.py'
      - 'integrations/gemini.py'
      - 'scripts/test_llm_cost_logging_contract.py'
      - '.github/workflows/llm-cost-logging-check.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: LLM token/cost logging contract (no SDK, no network)
        env:
          PYTHONPATH: .
        run: python scripts/test_llm_cost_logging_contract.py
