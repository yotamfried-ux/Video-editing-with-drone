name: Pipeline Dispatch Check

# Tracked dispatch for Run pipeline and Reset and rerun: shared service behaviour,
# GitHub run correlation, workflow wiring and web-api / mobile type safety.
on:
  pull_request:
    paths:
      - 'web-api/src/lib/pipeline-dispatch*.ts'
      - 'web-api/src/lib/github-dispatch-error.ts'
      - 'web-api/src/app/api/operator/pipeline/**'
      - 'web-api/tests/**'
      - 'web-api/package.json'
      - 'mobile/src/app/(operator)/pipeline.tsx'
      - 'mobile/src/features/operator/**'
      - 'integrations/run_status.py'
      - 'scripts/record_run_correlation.py'
      - 'scripts/finalize_unfinished_run.py'
      - 'scripts/reset_and_rerun.py'
      - 'scripts/test_run_correlation_contract.py'
      - 'scripts/test_simple_raw_dispatch_contract.py'
      - '.github/workflows/pipeline-run.yml'
      - '.github/workflows/pipeline-dispatch-check.yml'

permissions:
  contents: read

jobs:
  dispatch-behaviour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Shared dispatch service behaviour (concurrency, duplicates, failures)
        run: node --test web-api/tests/pipeline-dispatch.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pyyaml
      - name: Run correlation and reset tracking contract
        run: python scripts/test_run_correlation_contract.py
      - name: Finalizer (failure, cancellation, timeout)
        run: python scripts/test_finalize_unfinished_run_contract.py
      - name: Simple RAW / reset dispatch contract
        run: python scripts/test_simple_raw_dispatch_contract.py

  web-api-types:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-api/package-lock.json
      - run: npm ci
      - run: npm run type-check
