name: Pipeline Live Gemini QA Probe (opt-in isolated)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-gemini-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify opt-in credential exists
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY secret missing; no live API call made"
            exit 1
          fi
      - name: Install probe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet google-genai python-dotenv langsmith
      - name: Invoke Gemini once on isolated synthetic video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGSMITH_TRACING: 'false'
          PYTHONPATH: .
        run: python scripts/test_gemini_live_qa_probe.py
