name: Security Qualification

on:
  workflow_dispatch:
    inputs:
      run_dast:
        description: Run authorized OWASP ZAP baseline against production
        required: false
        default: true
        type: boolean
  pull_request:
    paths:
      - 'mobile/**'
      - 'web-api/**'
      - 'pipeline/**'
      - 'scripts/**'
      - 'package*.json'
      - '**/package*.json'
      - '**/requirements*.txt'
      - '.github/workflows/security-qualification.yml'
      - '.gitleaks.toml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'web-api/**'
      - 'pipeline/**'
      - 'scripts/**'
      - 'package*.json'
      - '**/package*.json'
      - '**/requirements*.txt'
      - '.github/workflows/security-qualification.yml'
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-${{ matrix.language }}

      - name: Report and gate high-severity CodeQL findings
        env:
          CODEQL_RESULTS_DIR: ${{ runner.temp }}/codeql-${{ matrix.language }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["CODEQL_RESULTS_DIR"])
          sarif_files = sorted(root.rglob("*.sarif"))
          if not sarif_files:
              raise SystemExit(f"No CodeQL SARIF files found under {root}")

          high = []
          all_security = []
          for path in sarif_files:
              data = json.loads(path.read_text(encoding="utf-8"))
              for run in data.get("runs", []):
                  tool = run.get("tool", {})
                  descriptors = []
                  driver = tool.get("driver") or {}
                  descriptors.extend(driver.get("rules") or [])
                  for ext in tool.get("extensions") or []:
                      descriptors.extend(ext.get("rules") or [])
                  rules = {r.get("id"): r for r in descriptors if r.get("id")}
                  for result in run.get("results") or []:
                      rid = result.get("ruleId")
                      rule = rules.get(rid, {})
                      props = rule.get("properties") or {}
                      raw_score = props.get("security-severity")
                      try:
                          score = float(raw_score)
                      except (TypeError, ValueError):
                          continue
                      loc = {}
                      locations = result.get("locations") or []
                      if locations:
                          loc = (locations[0].get("physicalLocation") or {})
                      artifact = ((loc.get("artifactLocation") or {}).get("uri"))
                      region = loc.get("region") or {}
                      msg = ((result.get("message") or {}).get("text") or "").replace("\n", " ")
                      title = ((rule.get("shortDescription") or {}).get("text") or rid or "CodeQL")
                      item = {
                          "score": score,
                          "rule": rid,
                          "title": title,
                          "file": artifact,
                          "line": region.get("startLine"),
                          "message": msg[:500],
                      }
                      all_security.append(item)
                      if score >= 7.0:
                          high.append(item)

          print("CODEQL_SECURITY_RESULTS=" + json.dumps(all_security, sort_keys=True))
          if high:
              print("CODEQL_HIGH_OR_CRITICAL=" + json.dumps(high, sort_keys=True))
              raise SystemExit(f"CodeQL found {len(high)} high/critical security result(s)")
          print("CODEQL_HIGH_OR_CRITICAL=0")
          PY

  regressions:
    name: Security regression contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: E2E state never persists passwords
        run: python3 scripts/test_app_user_e2e_state_security.py
      - name: R2 XML decoder performs one decode pass
        run: node web-api/scripts/test-r2-xml-decoder.cjs

  osv:
    name: OSV dependency visibility
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@0c58c542420dfd23fcac08dd9c8ca3cca9c36f1a # v2.5.0
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  secrets-and-config:
    name: Secrets, dependencies and configuration
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks repository and history scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify narrow unfixed-tooling exception scope
        run: python3 scripts/test_unfixed_tooling_vulnerability_scope.py

      - name: Trivy filesystem qualification
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Trivy visibility scan for unfixed findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: '0'

  mobile-source-security:
    name: MobSF mobile source scan
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Run mobsfscan
        uses: MobSF/mobsfscan@4645ea70bc093268502fe9f6df93e41bb482254a
        with:
          args: 'mobile --sarif --output results.sarif || true'
      - name: Upload mobsfscan SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

  supply-chain-posture:
    name: OpenSSF Scorecard posture
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: Preserve Scorecard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 30
          if-no-files-found: warn

  zap-baseline:
    name: OWASP ZAP production baseline
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.run_dast) ||
      github.event_name == 'schedule' ||
      github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Passive/baseline DAST against authorized SportReel deployment
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'https://video-editing-with-drone.vercel.app'
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-security-qualification
