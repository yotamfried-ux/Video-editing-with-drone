name: Quality-first 4K Contract

on:
  pull_request:
    paths:
      - 'pipeline/quality_preserving_framing.py'
      - 'pipeline/required_perception_policy.py'
      - 'pipeline/bootstrap.py'
      - 'pipeline/silent_output_policy.py'
      - 'services/delivery.py'
      - 'requirements.txt'
      - 'mobile/**'
      - 'web-api/**'
      - 'DEPLOYMENT.md'
      - 'supabase/migrations/20260612_create_core_schema.sql'
      - 'supabase/migrations/20260721_remove_face_recognition.sql'
      - 'supabase/verify_schema.sql'
      - 'scripts/test_quality_first_4k_policy_contract.py'
      - 'scripts/test_quality_first_4k_media_contract.py'
      - 'scripts/test_delivery_disk_bound_contract.py'
      - '.github/workflows/pipeline-run.yml'
      - '.github/workflows/quality-first-4k-contract.yml'
  workflow_dispatch:

jobs:
  contract:
    # Same image as pipeline-run.yml so the contract validates the encoder production uses.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: fixture-not-used
      GOOGLE_SERVICE_ACCOUNT_JSON: fixture-not-used
      RAW_FOLDER_ID: fixture-raw
      PROCESSED_FOLDER_ID: fixture-processed
      REVIEW_FOLDER_ID: fixture-review
      APPROVED_FOLDER_ID: fixture-approved
      OWNER_EMAIL: fixture@example.invalid
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media-contract dependencies
        run: pip install --disable-pip-version-check python-dotenv
      - name: Restore ffmpeg packages
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: ffmpeg-debs-ubuntu-24.04-v1
      - name: Install and verify ffmpeg tools
        timeout-minutes: 9
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -1; exit 0
          fi
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-debs
          if ls ~/apt-debs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/apt-debs/*.deb >/dev/null \
             && command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "FFmpeg installed offline from cached packages"
            ffmpeg -version | head -1; exit 0
          fi
          # Runner sources use mirror+file (and may resolve to slow EC2 mirrors).
          # Match the production pipeline's first-attempt archive fallback.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            [ -f "$source" ] || continue
            sudo sed -i \
              -e 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' \
              -e 's|http://us-east-2.ec2.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              "$source"
          done
          rm -f ~/apt-debs/*.deb
          APT_OPTS="-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=30"
          for attempt in 1 2; do
            if timeout 75 sudo apt-get $APT_OPTS update \
               && timeout 150 sudo apt-get $APT_OPTS install -y --no-install-recommends --download-only -o Dir::Cache::archives="$HOME/apt-debs" ffmpeg \
               && sudo dpkg -i ~/apt-debs/*.deb >/dev/null \
               && command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
              sudo chown -R "$USER" ~/apt-debs
              rm -rf ~/apt-debs/partial ~/apt-debs/lock
              ffmpeg -version | head -1
              exit 0
            fi
            echo "::warning::FFmpeg download attempt $attempt failed or timed out"
          done
          echo "::error::FFmpeg install failed after bounded attempts against Ubuntu archive"
          exit 1
      - name: Save ffmpeg packages
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: ffmpeg-debs-ubuntu-24.04-v1
      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            pipeline/required_perception_policy.py \
            pipeline/quality_preserving_framing.py \
            pipeline/bootstrap.py \
            pipeline/silent_output_policy.py \
            services/delivery.py \
            scripts/test_quality_first_4k_policy_contract.py \
            scripts/test_quality_first_4k_media_contract.py \
            scripts/test_delivery_disk_bound_contract.py
      - name: Run quality-first product contract
        run: python scripts/test_quality_first_4k_policy_contract.py
      - name: Validate bounded delivery disk usage
        run: python scripts/test_delivery_disk_bound_contract.py
      - name: Render and probe a real 4K/30 fixture
        run: |
          set +e
          python scripts/test_quality_first_4k_media_contract.py > /tmp/quality-first-4k-media.log 2>&1
          status=$?
          cat /tmp/quality-first-4k-media.log
          echo "$status" > /tmp/quality-first-4k-media.status
          exit "$status"
      - name: Upload 4K media diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-first-4k-media-${{ github.run_id }}
          path: |
            /tmp/quality-first-4k-media.log
            /tmp/quality-first-4k-media.status
          if-no-files-found: warn
