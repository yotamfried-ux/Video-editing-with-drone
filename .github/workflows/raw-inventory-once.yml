name: RAW inventory (one-off, read-only)

# One-off, READ-ONLY run of scripts/raw_recovery.py (`inventory`, then `plan`) requested by the owner. It exists because
# workflow_dispatch needs the workflow on the default branch and nothing is merged yet. It runs only for a push of THIS
# file on the feature branch, has no apply mode, and issues only list/head/get on R2 and one SELECT-style GET on Supabase.
# It is deleted right after the run.
on:
  push:
    branches: [ccr-5ce1d535-e7mo2b]
    paths: ['.github/workflows/raw-inventory-once.yml']

permissions:
  contents: read

concurrency:
  group: raw-recovery
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check boto3 python-dotenv requests
      - name: Inventory and plan (read-only)
        env:
          SUPABASE_URL: https://bcndgmymnismbxvdeetc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_KEY_ID }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'sportreel' }}
          STORAGE_BACKEND: r2
        run: |
          mkdir -p out
          python scripts/raw_recovery.py inventory --out out/inventory.json
          python scripts/raw_recovery.py plan --out out/plan.json
      - name: Compact report (names, sizes, states, short hashes only)
        if: always()
        run: |
          python - <<'PY'
          import json, os
          for f in ('out/inventory.json', 'out/plan.json'):
              if not os.path.exists(f):
                  print(f, 'MISSING'); continue
              d = json.load(open(f))
              print('=====', f, '| by prefix:', d['r2_video_objects_by_prefix'], '| tracked:', d['tracked_sources'], '| summary:', d['summary'],
                    '| aborted/removed records:', d['aborted_or_removed_records'], '| planned copies:', len(d['actions']))
              if f.endswith('plan.json'):
                  for e in d['entries']:
                      print(f"{e['state']:<14} {round((e.get('size') or 0)/1048576,1):>8} MB  {e['storage_key'].rsplit('/',1)[-1]:<40} where={e.get('where','-').split('/')[0]}/ sha8={(e.get('sha256') or '-')[:8]} verified={'yes' if e.get('verified_sha256') else '-'} {e.get('note','')}")
                  print('unmatched raw objects:', len(d['unmatched_raw_objects']), d['unmatched_raw_objects'][:20])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-inventory-once
          path: out/
          retention-days: 1
          if-no-files-found: ignore
