name: Large Upload Foundation Check

on:
  pull_request:
    paths:
      - '.github/workflows/large-upload-foundation-check.yml'
      - '.github/workflows/production-release-command.yml'
      - '.github/workflows/upload-foundation-release.yml'
      - 'docs/app-pipeline-audit.md'
      - 'docs/audit/drone-large-upload-experiment-entry-plan-20260723.md'
      - 'docs/audit/production-release-command-control-20260726.md'
      - 'docs/audit/production-release-gate-20260724.md'
      - 'mobile/app.json'
      - 'mobile/modules/sportreel-source-reader/**'
      - 'mobile/src/app/(operator)/pipeline.tsx'
      - 'mobile/src/features/operator/lib/multipartUploadClient.ts'
      - 'mobile/src/features/operator/lib/multipartUploadLedger.ts'
      - 'mobile/src/features/operator/lib/uploadLocalCleanup.ts'
      - 'mobile/src/features/operator/lib/uploadQueue.ts'
      - 'mobile/src/features/operator/lib/uploadQueue.test.ts'
      - 'mobile/src/features/operator/types/contracts.ts'
      - 'scripts/apply_upload_release_migrations.py'
      - 'scripts/production_release_command.py'
      - 'scripts/record_eas_build_evidence.py'
      - 'scripts/remove_biometric_storage.py'
      - 'scripts/test_batch_scope_contract.py'
      - 'scripts/test_exact_source_upload_dedup_contract.py'
      - 'scripts/test_large_upload_ci_hygiene_contract.py'
      - 'scripts/test_large_upload_foundation_contract.py'
      - 'scripts/test_multi_upload_batch_contract.py'
      - 'scripts/test_production_release_command_contract.py'
      - 'scripts/test_production_release_gate_contract.py'
      - 'scripts/test_production_release_negative_contracts.py'
      - 'scripts/test_rate_limit_backend_contract.py'
      - 'scripts/test_production_upload_api_smoke.py'
      - 'scripts/test_real_r2_multipart_upload.py'
      - 'scripts/test_upload_batch_verified_gate_contract.py'
      - 'scripts/test_upload_foundation_release_contract.py'
      - 'scripts/verify_production_deployment.py'
      - 'scripts/verify_no_biometric_runtime_dependencies.py'
      - 'scripts/verify_r2_cors.py'
      - 'scripts/verify_upload_release_schema.sql'
      - 'supabase/migrations/20260721_remove_face_recognition.sql'
      - 'supabase/migrations/20260723_source_upload_exact_dedup.sql'
      - 'supabase/migrations/20260723_source_upload_multipart_foundation.sql'
      - 'supabase/migrations/20260723_single_put_size_evidence.sql'
      - 'supabase/migrations/20260723_source_upload_local_cleanup_evidence.sql'
      - 'supabase/migrations/20260723_upload_batch_verified_gate.sql'
      - 'supabase/migrations/20260723_upload_start_idempotency.sql'
      - 'supabase/migrations/20260918_remove_residual_biometric_functions.sql'
      - 'supabase/migrations/20260918_supabase_rate_limit.sql'
      - 'web-api/src/app/api/operator/pipeline/start/route.ts'
      - 'web-api/src/app/api/operator/upload/route.ts'
      - 'web-api/src/app/api/operator/upload/batch/route.ts'
      - 'web-api/src/app/api/operator/upload/multipart/**'
      - 'web-api/src/lib/multipart-upload-manifest.ts'
      - 'web-api/src/lib/r2-storage.ts'
      - 'web-api/src/lib/ratelimit.ts'
      - 'web-api/src/lib/source-upload-manifest.ts'
      - 'web-api/src/lib/upload-batch-manifest.ts'
      - 'web-api/src/types/operator-contracts.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check final-head code patch hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA"...HEAD -- . ':(exclude)*.md'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate upload foundation and production release contracts
        run: |
          python -m py_compile \
            scripts/apply_upload_release_migrations.py \
            scripts/production_release_command.py \
            scripts/record_eas_build_evidence.py \
            scripts/remove_biometric_storage.py \
            scripts/test_production_upload_api_smoke.py \
            scripts/test_real_r2_multipart_upload.py \
            scripts/verify_production_deployment.py \
            scripts/verify_r2_cors.py \
            scripts/verify_no_biometric_runtime_dependencies.py
          python scripts/test_large_upload_ci_hygiene_contract.py
          python scripts/test_large_upload_foundation_contract.py
          python scripts/test_upload_batch_verified_gate_contract.py
          python scripts/test_upload_foundation_release_contract.py
          python scripts/test_production_release_command_contract.py
          python scripts/test_production_release_gate_contract.py
          python scripts/test_production_release_negative_contracts.py
          python scripts/test_rate_limit_backend_contract.py
          python scripts/test_multi_upload_batch_contract.py
          PYTHONPATH=scripts:. python scripts/test_exact_source_upload_dedup_contract.py
          PYTHONPATH=scripts:. python scripts/test_batch_scope_contract.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-api/package-lock.json

      - name: Type-check Web API multipart endpoints
        working-directory: web-api
        run: |
          npm ci
          npm run type-check

      - name: Validate mobile upload queue and native module autolinking
        working-directory: mobile
        run: |
          npm ci
          npm run type-check
          npm test -- --runInBand src/features/operator/lib/uploadQueue.test.ts
          npx expo-modules-autolinking resolve --platform android > /tmp/expo-modules-android.json
          grep -q 'SportReelSourceReaderModule' /tmp/expo-modules-android.json

  android-native-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Compute native compile qualification key
        id: native-key
        shell: bash
        run: |
          KEY="$(python - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          root = pathlib.Path(".")
          paths = subprocess.check_output(
              ["git", "ls-files", "-z", "mobile"],
          ).split(b"\0")
          selected = []
          for raw in paths:
              if not raw:
                  continue
              rel = raw.decode()
              if rel.startswith("mobile/.maestro/"):
                  continue
              selected.append(rel)
          selected.append(".github/workflows/large-upload-foundation-check.yml")

          digest = hashlib.sha256()
          for rel in sorted(selected):
              path = root / rel
              digest.update(rel.encode())
              digest.update(b"\0")
              digest.update(path.read_bytes())
              digest.update(b"\0")
          print(digest.hexdigest())
          PY
          )"
          echo "key=large-upload-native-v1-${RUNNER_OS}-$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore successful native compile marker
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/large-upload-native-compile.ok
          key: ${{ steps.native-key.outputs.key }}

      - name: Verify cached native compile marker
        if: steps.native-cache.outputs.cache-hit == 'true'
        run: test -s "$RUNNER_TEMP/large-upload-native-compile.ok"

      - uses: actions/setup-node@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate the Android project with the local module
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        env:
          CI: '1'
        run: |
          npm ci
          npx expo prebuild --platform android --clean --no-install

      - name: Compile Android Kotlin, including SportReelSourceReader
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Record successful native compile
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          printf 'qualified_sha=%s\n' "${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"             > "$RUNNER_TEMP/large-upload-native-compile.ok"

      - name: Save successful native compile marker
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/large-upload-native-compile.ok
          key: ${{ steps.native-key.outputs.key }}
