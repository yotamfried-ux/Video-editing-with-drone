name: A/B Action Selection

# Read-only experiment: downloads a sample of sources from R2 processed/, runs the real Gemini
# analysis with the baseline and each cost-saving variant, and compares which actions get selected.
# Writes nothing to storage or Supabase. It spends Gemini quota (see llm cost lines in the log).
on:
  # One-shot trigger for the feature branch (a workflow can only be dispatched by API once it exists on
  # the default branch): editing .github/ab-run-request.txt on this branch starts a run.
  push:
    branches: [feat/cost-time-optimizations]
    paths: ['.github/ab-run-request.txt']
  workflow_dispatch:
    inputs:
      sample:
        description: 'Number of long sources to analyse (each runs once per variant)'
        default: '8'
      variants:
        description: 'Comma list: lowres,fps05,trim,combined'
        default: 'lowres,fps05,trim,combined'

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run A/B
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-pro' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_KEY_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'sportreel' }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          STORAGE_BACKEND: r2
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: .
        run: python -u scripts/ab_action_selection.py --sample "${{ inputs.sample || '8' }}" --variants "${{ inputs.variants || 'lowres,fps05,trim,combined' }}" --out /tmp/ab
      - name: Upload A/B results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-action-selection-${{ github.run_id }}
          path: |
            /tmp/ab/ab_results.json
            /tmp/ab/ab_summary.md
            /tmp/ab/tmp/pipeline-debug/**
          if-no-files-found: warn
