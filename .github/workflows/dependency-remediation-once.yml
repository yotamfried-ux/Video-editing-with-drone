name: One-shot Dependency Remediation

on:
  push:
    branches:
      - tooling/app-qualification-capabilities
    paths:
      - '.github/workflows/dependency-remediation-once.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tooling/app-qualification-capabilities
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Raise Python security floors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("requirements.txt")
          s = p.read_text()
          s = s.replace("torch>=2.0.0", "torch>=2.13.0")
          s = s.replace("torchvision>=0.15.0", "torchvision>=0.28.0")
          if "anyio>=" not in s:
              s = s.replace("python-dotenv>=1.0.0\n", "python-dotenv>=1.0.0\nanyio>=4.14.2\n")
          p.write_text(s)
          PY

      - name: Remediate web-api lockfile
        working-directory: web-api
        run: |
          npm install --package-lock-only --save-exact next@15.5.24
          npm update --package-lock-only
          npm audit fix --package-lock-only || true
          npm audit --json > ../web-api-audit.json || true

      - name: Remediate mobile lockfile within declared compatibility ranges
        working-directory: mobile
        run: |
          npm update --package-lock-only
          npm audit fix --package-lock-only || true
          npm audit --json > ../mobile-audit.json || true

      - name: Verify generated dependency state
        run: |
          set -e
          cd web-api
          npm ci --no-audit --no-fund
          npm run type-check
          npm run build
          cd ../mobile
          npm ci --no-audit --no-fund
          npm run type-check
          npm test -- --runInBand
          cd ..
          python -m pip install --upgrade pip
          python -m pip install --dry-run -r requirements.txt > python-resolution.txt

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-remediation-audits
          path: |
            web-api-audit.json
            mobile-audit.json
            python-resolution.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Commit generated dependency remediation
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt web-api/package.json web-api/package-lock.json mobile/package.json mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes generated."
            exit 0
          fi
          git commit -m "fix(deps): remediate known dependency vulnerabilities"
          git push origin HEAD:tooling/app-qualification-capabilities
