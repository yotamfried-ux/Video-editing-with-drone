name: Payment Single-Mechanism Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/src/features/payment/**"
      - "mobile/src/app/checkout/**"
      - "web-api/src/app/api/checkout/**"
      - "web-api/src/app/api/webhooks/**"
      - ".github/workflows/payment-single-mechanism.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert one user-facing payment mechanism
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          hook=Path("mobile/src/features/payment/hooks/useCheckout.ts").read_text()
          screen=Path("mobile/src/app/checkout/[reel_id].tsx").read_text()
          assert "createStripeCheckout" in hook and "/api/checkout/" in hook and "/api/checkout/stripe" not in hook
          assert "createMeshulamCheckout" not in hook
          assert "BitWebView" not in screen
          assert "EXPO_PUBLIC_BIT_ENABLED" not in screen
          assert "Pay with Bit" not in screen
          assert "Pay with Card" in screen\n          retired=[Path("web-api/src/app/api/checkout/stripe/route.ts"),Path("web-api/src/app/api/webhooks/stripe/route.ts"),Path("web-api/src/app/api/checkout/meshulam/route.ts"),Path("web-api/src/app/api/webhooks/meshulam/route.ts"),Path("web-api/src/lib/meshulam.ts"),Path("mobile/src/features/payment/components/BitWebView.tsx")]\n          assert not any(p.exists() for p in retired), [str(p) for p in retired if p.exists()]\n          assert Path("web-api/src/app/api/checkout/[token]/route.ts").exists()\n          assert Path("web-api/src/app/api/payments/webhook/route.ts").exists()
          print("PAYMENT SINGLE-MECHANISM CONTRACT PASS: canonical Stripe Checkout + webhook only")
          PY
