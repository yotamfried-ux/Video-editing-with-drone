name: Tracked Run Finalize Check

on:
  pull_request:
    paths:
      - 'scripts/finalize_unfinished_run.py'
      - 'scripts/test_finalize_unfinished_run_contract.py'
      - 'scripts/run_tracked.py'
      - 'integrations/delivery_status.py'
      - '.github/workflows/deliver.yml'
      - '.github/workflows/pipeline-run.yml'
      - '.github/workflows/tracked-run-finalize-check.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet pyyaml
      - run: python scripts/test_finalize_unfinished_run_contract.py
