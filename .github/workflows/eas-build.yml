name: EAS Build
# validation trigger: second push after workflow registration

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options: [android, ios]
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options: [preview, production]
  push:
    branches: [validation/eas-android-qualification]

jobs:
  build-android:
    name: Build Android preview
    if: github.event_name == 'push' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build Android locally
        working-directory: mobile
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: eas build --platform android --profile preview --non-interactive --local --output /tmp/sportreel.apk
      - name: Upload APK to Expo
        working-directory: mobile
        run: eas upload --platform android --build-path /tmp/sportreel.apk --non-interactive
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportreel-android-preview-${{ github.sha }}
          path: /tmp/sportreel.apk
          retention-days: 14
