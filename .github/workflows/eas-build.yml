name: EAS Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
      profile:
        description: 'Build profile'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  # Android builds run locally on the GH runner — no EAS queue wait (~15 min).
  build-android:
    name: Build Android (${{ inputs.profile }})
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Production is an Android App Bundle for Google Play; internal preview
      # is an installable APK. Never upload an AAB as though it were an APK.
      - name: Build Android locally
        id: android-build
        working-directory: mobile
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_PROFILE: ${{ inputs.profile }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_PROFILE" = "production" ]; then
            OUTPUT=/tmp/sportreel-production.aab
          else
            OUTPUT=/tmp/sportreel-preview.apk
          fi
          eas build --platform android --profile "$BUILD_PROFILE" --non-interactive --local --output "$OUTPUT"
          test -s "$OUTPUT"
          echo "artifact=$OUTPUT" >> "$GITHUB_OUTPUT"

      # Only preview APKs are directly installable on a phone.
      - name: Upload preview APK to Expo (install link)
        if: inputs.profile == 'preview'
        working-directory: mobile
        run: eas upload --platform android --build-path /tmp/sportreel-preview.apk --non-interactive

      - name: Upload signed Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportreel-android-${{ inputs.profile }}-${{ github.sha }}
          path: ${{ steps.android-build.outputs.artifact }}
          if-no-files-found: error
          retention-days: 14

  # iOS must build remotely on EAS (needs macOS + Xcode). Submit and exit fast.
  build-ios:
    name: Build iOS (${{ inputs.profile }}) — remote EAS
    if: inputs.platform == 'ios'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit iOS build to EAS (no-wait)
        working-directory: mobile
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
