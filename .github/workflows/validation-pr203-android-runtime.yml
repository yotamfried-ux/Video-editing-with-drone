name: Validation PR203 Android Runtime

on:
  push:
    branches: [validation/pr203-app-runtime]
    paths: [.github/workflows/validation-pr203-android-runtime.yml]
  workflow_dispatch:
    inputs:
      golden:
        description: Rebuild APK from scratch for a Golden E2E checkpoint
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ID: com.sportreel.app
      TESTED_SHA: b76cdd5e9434d5f2f681cc5a2f485f247996cda0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Restore provenance-pinned APK checkpoint
        id: apk-cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.golden != true }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sportreel-pr203.apk
          key: sportreel-android-debug-${{ env.TESTED_SHA }}-v2

      - name: Generate native Android project
        if: ${{ steps.apk-cache.outputs.cache-hit != 'true' }}
        working-directory: mobile
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Build exact debug APK
        if: ${{ steps.apk-cache.outputs.cache-hit != 'true' }}
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Checkpoint exact debug APK
        if: ${{ steps.apk-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/sportreel-pr203.apk"
      - name: Persist APK checkpoint before runtime experiments
        if: ${{ steps.apk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sportreel-pr203.apk
          key: sportreel-android-debug-${{ env.TESTED_SHA }}-v2
      - name: Record APK provenance
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/sportreel-pr203.apk"
          test -f "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk.sha256"
          echo "$TESTED_SHA" > "$RUNNER_TEMP/tested-commit.txt"
          echo "apk_cache_hit=${{ steps.apk-cache.outputs.cache-hit }}" | tee "$RUNNER_TEMP/apk-checkpoint.txt"
          echo "golden=${{ inputs.golden || false }}" | tee -a "$RUNNER_TEMP/apk-checkpoint.txt"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Start Metro bundler
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          nohup npx expo start --localhost --non-interactive > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/metro.log" >&2 || true
          exit 1

      - name: Create sequential Android experiment script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/android-validation.sh" <<'SH'
          set -euo pipefail
          ROOT="$RUNNER_TEMP/android-evidence"
          APP01="$ROOT/APP-01"
          APP02="$ROOT/APP-02"
          mkdir -p "$APP01" "$APP02"
          dump_ui() {
            local dest="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$dest" >/dev/null 2>&1 || true
          }
          bounds_for_text() {
            local file="$1" text="$2"
            grep -o "text=\"$text\"[^>]*bounds=\"[^\"]*\"" "$file" | head -n1 | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p'
          }
          tap_text() {
            local file="$1" text="$2" b
            b=$(bounds_for_text "$file" "$text")
            test -n "$b"
            read X1 Y1 X2 Y2 <<< "$b"
            adb shell input tap $(((X1+X2)/2)) $(((Y1+Y2)/2))
          }
          collect_final() {
            set +e
            adb exec-out screencap -p > "$ROOT/final.png" 2>/dev/null
            dump_ui "$ROOT/final-ui.xml"
            adb logcat -d > "$ROOT/logcat.txt" 2>/dev/null
            adb logcat -b crash -d > "$ROOT/crash-logcat.txt" 2>/dev/null
          }
          trap collect_final EXIT

          adb wait-for-device
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"
          adb reverse tcp:8081 tcp:8081
          adb reverse --list > "$ROOT/adb-reverse.txt"
          adb install -r "$RUNNER_TEMP/sportreel-pr203.apk" | tee "$ROOT/install.txt"
          adb shell pm clear "$APP_ID" >/dev/null
          adb logcat -c
          ACTIVITY=$(adb shell cmd package resolve-activity --brief "$APP_ID" | tr -d '\r' | tail -n1)
          test -n "$ACTIVITY"
          echo "$ACTIVITY" > "$ROOT/activity.txt"
          adb shell am force-stop com.google.android.apps.nexuslauncher || true
          adb shell am force-stop com.android.launcher3 || true
          adb shell am start -n "$ACTIVITY" > "$APP01/launch.txt"

          # APP-01 — launch/login screen. Independent evidence is written before APP-02 starts.
          OK=0
          # First launch can occasionally be lost while Android finishes settling after
          # boot/install. Re-assert the activity periodically instead of turning that
          # infrastructure race into an APP-01 product failure.
          for i in $(seq 1 60); do
            dump_ui "$APP01/ui.xml"
            if grep -Fq "Welcome Back" "$APP01/ui.xml"; then OK=1; break; fi
            if grep -Eq "isn't responding|is not responding|Close app|Wait|keeps stopping" "$APP01/ui.xml"; then
              cp "$APP01/ui.xml" "$APP01/system-dialog-$i.xml" || true
              adb shell input keyevent 4 || true
            fi
            if [ "$i" = "10" ] || [ "$i" = "25" ] || [ "$i" = "40" ]; then
              adb shell dumpsys window windows > "$APP01/window-$i.txt" 2>/dev/null || true
              adb shell dumpsys activity activities > "$APP01/activity-$i.txt" 2>/dev/null || true
              adb shell am force-stop "$APP_ID" || true
              sleep 1
              adb shell am start -n "$ACTIVITY" > "$APP01/relaunch-$i.txt" 2>&1 || true
            fi
            sleep 2
          done
          adb exec-out screencap -p > "$APP01/screenshot.png"
          adb logcat -d > "$APP01/logcat.txt"
          test "$OK" = "1" || { echo 'APP-01 FAIL: Welcome Back not visible' >&2; exit 1; }
          ! grep -Fq "supabaseUrl is required" "$APP01/logcat.txt"
          ! grep -q "FATAL EXCEPTION" "$APP01/logcat.txt"
          printf '{"experiment":"APP-01","tested_commit":"%s","status":"PASS"}\n' "$TESTED_SHA" > "$APP01/evidence.json"

          # APP-02 — continue in the same emulator/session; no rebuild and no second boot.
          tap_text "$APP01/ui.xml" "Create Account"
          sleep 2
          dump_ui "$APP02/register.xml"
          grep -Fq "Create Account" "$APP02/register.xml"
          EMAIL="yotam.fried+sportreel.validation.$(date +%s).$GITHUB_RUN_ID@gmail.com"
          PASSWORD="SrV$(date +%s)9x"
          # Resolve the two EditText nodes by their bounds. Tapping placeholder
          # text is unreliable once React Native focus/keyboard state changes.
          mapfile -t EDIT_BOUNDS < <(grep -o 'class="android.widget.EditText"[^>]*bounds="[^"]*"' "$APP02/register.xml" | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p')
          printf '%s\\n' "${EDIT_BOUNDS[@]}" > "$APP02/edittext-bounds.txt"
          test "${#EDIT_BOUNDS[@]}" -ge 2 || { echo 'APP-02 HARNESS FAIL: expected two EditText fields' >&2; exit 1; }
          read EX1 EY1 EX2 EY2 <<< "${EDIT_BOUNDS[0]}"
          adb shell input tap $(((EX1+EX2)/2)) $(((EY1+EY2)/2))
          adb shell input text "$EMAIL"

          # KeyboardAvoidingView moves the form after the keyboard opens, so the
          # password coordinates from register.xml are stale. Re-dump the live UI
          # and target the secure EditText at its post-keyboard bounds.
          sleep 1
          dump_ui "$APP02/after-email.xml"
          PASSWORD_BOUNDS=$(grep -o 'class="android.widget.EditText"[^>]*password="true"[^>]*bounds="[^"]*"' "$APP02/after-email.xml" | head -n1 | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p')
          test -n "$PASSWORD_BOUNDS" || { echo 'APP-02 HARNESS FAIL: secure password field not found after keyboard shift' >&2; exit 1; }
          echo "$PASSWORD_BOUNDS" > "$APP02/password-live-bounds.txt"
          read PX1 PY1 PX2 PY2 <<< "$PASSWORD_BOUNDS"
          adb shell input tap $(((PX1+PX2)/2)) $(((PY1+PY2)/2))
          adb shell input text "$PASSWORD"
          adb shell input keyevent 4 || true
          dump_ui "$APP02/filled.xml"
          grep -Fq "$EMAIL" "$APP02/filled.xml" || { echo 'APP-02 HARNESS FAIL: email not entered' >&2; exit 1; }
          if grep -Fq "${EMAIL}${PASSWORD}" "$APP02/filled.xml"; then
            echo 'APP-02 HARNESS FAIL: password appended to email field' >&2
            exit 1
          fi
          if grep -Fq "Password (min 6 chars)" "$APP02/filled.xml"; then
            echo 'APP-02 HARNESS FAIL: password field still empty' >&2
            exit 1
          fi
          tap_text "$APP02/filled.xml" "Continue"
          APP02_OK=0
          APP02_PRODUCT_FAIL=0
          for i in $(seq 1 30); do
            dump_ui "$APP02/result.xml"
            if grep -Fq "Check your email and click the confirmation link" "$APP02/result.xml" || grep -Fq "Your Name" "$APP02/result.xml"; then APP02_OK=1; break; fi
            if grep -Fq "Error sending confirmation email" "$APP02/result.xml"; then
              APP02_PRODUCT_FAIL=1
              printf '{"experiment":"APP-02","tested_commit":"%s","failure":"supabase_confirmation_email","status":"FAIL"}\n' "$TESTED_SHA" > "$APP02/evidence.json"
              echo 'APP-02 PRODUCT FAIL: Supabase returned Error sending confirmation email' >&2
              break
            fi
            sleep 2
          done
          adb exec-out screencap -p > "$APP02/screenshot.png" 2>/dev/null || true
          adb logcat -d > "$APP02/logcat.txt" 2>/dev/null || true
          test "$APP02_PRODUCT_FAIL" = "0" || exit 2
          test "$APP02_OK" = "1" || { echo 'APP-02 FAIL: registration did not reach confirmation/profile state' >&2; exit 1; }
          printf '{"experiment":"APP-02","tested_commit":"%s","registration_request_completed":true,"password_recorded":false,"status":"PASS"}\n' "$TESTED_SHA" > "$APP02/evidence.json"
          SH
          chmod +x "$RUNNER_TEMP/android-validation.sh"

      - name: Run sequential Android experiments on one emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          disable-linux-hw-accel: false
          script: bash "$RUNNER_TEMP/android-validation.sh"

      - name: Print failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          echo "::group::APP-02 result"
          test -f "$RUNNER_TEMP/android-evidence/APP-02/evidence.json" && cat "$RUNNER_TEMP/android-evidence/APP-02/evidence.json"
          test -f "$RUNNER_TEMP/android-evidence/APP-02/result.xml" && grep -E 'Error sending confirmation email|Check your email|Your Name' "$RUNNER_TEMP/android-evidence/APP-02/result.xml" || true
          echo "::endgroup::"
          echo "::group::Relevant Android errors"
          if [ -f "$RUNNER_TEMP/android-evidence/APP-02/logcat.txt" ]; then
            grep -Ei -C 6 'supabase|auth|email|smtp|error|exception|fail' "$RUNNER_TEMP/android-evidence/APP-02/logcat.txt" | tail -n 400 || true
          fi
          echo "::endgroup::"
          echo "::group::Metro errors"
          test -f "$RUNNER_TEMP/metro.log" && grep -Ei -C 6 'error|exception|fail|supabase|auth' "$RUNNER_TEMP/metro.log" | tail -n 300 || true
          echo "::endgroup::"

      - name: Publish experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr203-android-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/android-evidence/
            ${{ runner.temp }}/apk.sha256
            ${{ runner.temp }}/tested-commit.txt
            ${{ runner.temp }}/apk-checkpoint.txt
            ${{ runner.temp }}/metro.log
          if-no-files-found: warn
          retention-days: 30
