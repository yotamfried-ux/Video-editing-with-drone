name: Validation PR203 Android Runtime

on:
  push:
    branches: [validation/pr203-app-runtime]
    paths: [.github/workflows/validation-pr203-android-runtime.yml]
  workflow_dispatch:
    inputs:
      golden:
        description: Rebuild APK from scratch for a Golden E2E checkpoint
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  app-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ID: com.sportreel.app
      TESTED_SHA: b76cdd5e9434d5f2f681cc5a2f485f247996cda0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci

      - name: Restore provenance-pinned APK checkpoint
        id: apk-cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.golden != true }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sportreel-pr203.apk
          key: sportreel-android-debug-${{ env.TESTED_SHA }}-v2

      - name: Generate native Android project
        if: ${{ steps.apk-cache.outputs.cache-hit != 'true' }}
        working-directory: mobile
        run: CI=1 npx expo prebuild --platform android --no-install
      - name: Build exact debug APK
        if: ${{ steps.apk-cache.outputs.cache-hit != 'true' }}
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Checkpoint exact debug APK
        if: ${{ steps.apk-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" "$RUNNER_TEMP/sportreel-pr203.apk"
      - name: Persist APK checkpoint before runtime experiments
        if: ${{ steps.apk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sportreel-pr203.apk
          key: sportreel-android-debug-${{ env.TESTED_SHA }}-v2
      - name: Record APK provenance
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/sportreel-pr203.apk"
          test -f "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk.sha256"
          echo "$TESTED_SHA" > "$RUNNER_TEMP/tested-commit.txt"
          echo "apk_cache_hit=${{ steps.apk-cache.outputs.cache-hit }}" | tee "$RUNNER_TEMP/apk-checkpoint.txt"
          echo "golden=${{ inputs.golden || false }}" | tee -a "$RUNNER_TEMP/apk-checkpoint.txt"

      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Start Metro bundler
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          nohup npx expo start --localhost --non-interactive > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/metro.log" >&2 || true
          exit 1

      - name: Create sequential Android experiment script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/android-validation.sh" <<'SH'
          set -euo pipefail
          ROOT="$RUNNER_TEMP/android-evidence"
          mkdir -p "$ROOT/APP-03" "$ROOT/APP-04" "$ROOT/APP-05" "$ROOT/APP-06"
          dump_ui() {
            local dest="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$dest" >/dev/null 2>&1 || true
          }
          bounds_for_text() {
            grep -o "text=\"$2\"[^>]*bounds=\"[^\"]*\"" "$1" | head -n1 | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p'
          }
          tap_text() {
            local b; b=$(bounds_for_text "$1" "$2"); test -n "$b"
            read X1 Y1 X2 Y2 <<< "$b"; adb shell input tap $(((X1+X2)/2)) $(((Y1+Y2)/2))
          }
          wait_text() {
            local text="$1" dest="$2" ok=0
            for i in $(seq 1 30); do dump_ui "$dest"; if grep -Fq "$text" "$dest"; then ok=1; break; fi; sleep 2; done
            test "$ok" = "1"
          }
          fill_edit_by_index() {
            local file="$1" idx="$2" value="$3" b
            mapfile -t BS < <(grep -o 'class="android.widget.EditText"[^>]*bounds="[^"]*"' "$file" | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p')
            b="${BS[$idx]}"; read X1 Y1 X2 Y2 <<< "$b"; adb shell input tap $(((X1+X2)/2)) $(((Y1+Y2)/2)); adb shell input text "$value"
          }
          trap 'adb logcat -d > "$ROOT/final-logcat.txt" 2>/dev/null || true; adb logcat -b crash -d > "$ROOT/crash-logcat.txt" 2>/dev/null || true; adb exec-out screencap -p > "$ROOT/final.png" 2>/dev/null || true' EXIT

          adb wait-for-device
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb reverse tcp:8081 tcp:8081
          adb install -r "$RUNNER_TEMP/sportreel-pr203.apk" | tee "$ROOT/install.txt"
          adb shell pm clear "$APP_ID" >/dev/null
          adb logcat -c
          ACTIVITY=$(adb shell cmd package resolve-activity --brief "$APP_ID" | tr -d '\r' | tail -n1)
          adb shell am start -n "$ACTIVITY" >/dev/null
          wait_text "Welcome Back" "$ROOT/APP-03/login.xml"

          # APP-03: real sign-in with the account created and email-confirmed by APP-02.
          EMAIL="yotam.fried+sportreel.validation.1789895341.35500812134@gmail.com"
          PASSWORD="SrV17898953419x"
          fill_edit_by_index "$ROOT/APP-03/login.xml" 0 "$EMAIL"
          sleep 1; dump_ui "$ROOT/APP-03/after-email.xml"
          PB=$(grep -o 'class="android.widget.EditText"[^>]*password="true"[^>]*bounds="[^"]*"' "$ROOT/APP-03/after-email.xml" | head -n1 | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p')
          test -n "$PB"; read X1 Y1 X2 Y2 <<< "$PB"; adb shell input tap $(((X1+X2)/2)) $(((Y1+Y2)/2)); adb shell input text "$PASSWORD"; adb shell input keyevent 4 || true
          dump_ui "$ROOT/APP-03/filled.xml"; tap_text "$ROOT/APP-03/filled.xml" "Sign In"
          wait_text "Your Name" "$ROOT/APP-03/result.xml"
          printf '{"experiment":"APP-03","tested_commit":"%s","status":"PASS"}\n' "$TESTED_SHA" > "$ROOT/APP-03/evidence.json"

          # APP-04: complete onboarding profile and reach Discover.
          fill_edit_by_index "$ROOT/APP-03/result.xml" 0 "SportReel_Validation"
          adb shell input keyevent 4 || true; dump_ui "$ROOT/APP-04/profile-filled.xml"; tap_text "$ROOT/APP-04/profile-filled.xml" "Finish"
          wait_text "SportReel" "$ROOT/APP-04/discover.xml"
          grep -Fq "Discover" "$ROOT/APP-04/discover.xml"
          printf '{"experiment":"APP-04","tested_commit":"%s","status":"PASS"}\n' "$TESTED_SHA" > "$ROOT/APP-04/evidence.json"

          # APP-05: Profile navigation + persisted session after process restart.
          tap_text "$ROOT/APP-04/discover.xml" "Profile"; wait_text "Save Name" "$ROOT/APP-05/profile.xml"
          grep -Fq "SportReel_Validation" "$ROOT/APP-05/profile.xml"
          adb shell am force-stop "$APP_ID"; sleep 2; adb shell am start -n "$ACTIVITY" >/dev/null
          wait_text "SportReel" "$ROOT/APP-05/relaunch.xml"
          ! grep -Fq "Welcome Back" "$ROOT/APP-05/relaunch.xml"
          printf '{"experiment":"APP-05","tested_commit":"%s","session_persisted":true,"status":"PASS"}\n' "$TESTED_SHA" > "$ROOT/APP-05/evidence.json"

          # APP-06: sign out, then sign back in; completed profile must skip onboarding.
          tap_text "$ROOT/APP-05/relaunch.xml" "Profile"; wait_text "Sign Out" "$ROOT/APP-06/profile.xml"; tap_text "$ROOT/APP-06/profile.xml" "Sign Out"
          wait_text "Welcome Back" "$ROOT/APP-06/signed-out.xml"
          fill_edit_by_index "$ROOT/APP-06/signed-out.xml" 0 "$EMAIL"
          sleep 1; dump_ui "$ROOT/APP-06/after-email.xml"
          PB=$(grep -o 'class="android.widget.EditText"[^>]*password="true"[^>]*bounds="[^"]*"' "$ROOT/APP-06/after-email.xml" | head -n1 | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p')
          read X1 Y1 X2 Y2 <<< "$PB"; adb shell input tap $(((X1+X2)/2)) $(((Y1+Y2)/2)); adb shell input text "$PASSWORD"; adb shell input keyevent 4 || true
          dump_ui "$ROOT/APP-06/filled.xml"; tap_text "$ROOT/APP-06/filled.xml" "Sign In"
          wait_text "SportReel" "$ROOT/APP-06/result.xml"
          ! grep -Fq "Your Name" "$ROOT/APP-06/result.xml"
          ! grep -q "FATAL EXCEPTION" "$ROOT/final-logcat.txt" 2>/dev/null || true
          printf '{"experiment":"APP-06","tested_commit":"%s","status":"PASS"}\n' "$TESTED_SHA" > "$ROOT/APP-06/evidence.json"
          SH
          chmod +x "$RUNNER_TEMP/android-validation.sh"

      - name: Run sequential Android experiments on one emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          disable-linux-hw-accel: false
          script: bash "$RUNNER_TEMP/android-validation.sh"

      - name: Print failure diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          echo "::group::APP-02 result"
          test -f "$RUNNER_TEMP/android-evidence/APP-02/evidence.json" && cat "$RUNNER_TEMP/android-evidence/APP-02/evidence.json"
          test -f "$RUNNER_TEMP/android-evidence/APP-02/result.xml" && grep -E 'Error sending confirmation email|Check your email|Your Name' "$RUNNER_TEMP/android-evidence/APP-02/result.xml" || true
          echo "::endgroup::"
          echo "::group::Relevant Android errors"
          if [ -f "$RUNNER_TEMP/android-evidence/APP-02/logcat.txt" ]; then
            grep -Ei -C 6 'supabase|auth|email|smtp|error|exception|fail' "$RUNNER_TEMP/android-evidence/APP-02/logcat.txt" | tail -n 400 || true
          fi
          echo "::endgroup::"
          echo "::group::Metro errors"
          test -f "$RUNNER_TEMP/metro.log" && grep -Ei -C 6 'error|exception|fail|supabase|auth' "$RUNNER_TEMP/metro.log" | tail -n 300 || true
          echo "::endgroup::"

      - name: Publish experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr203-android-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/android-evidence/
            ${{ runner.temp }}/apk.sha256
            ${{ runner.temp }}/tested-commit.txt
            ${{ runner.temp }}/apk-checkpoint.txt
            ${{ runner.temp }}/metro.log
          if-no-files-found: warn
          retention-days: 30
