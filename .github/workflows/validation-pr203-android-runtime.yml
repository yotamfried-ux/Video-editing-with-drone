name: Validation PR203 Android Runtime

on:
  push:
    branches: [validation/pr203-app-runtime]
    paths: [.github/workflows/validation-pr203-android-runtime.yml]

permissions:
  contents: read

jobs:
  app-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APP_ID: com.sportreel.app
      TESTED_SHA: c37c7c10fbb68a040a530a024e091d089925d5f1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Build exact debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Record APK provenance
        shell: bash
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk.sha256"
          echo "$TESTED_SHA" > "$RUNNER_TEMP/tested-commit.txt"
          cp "$APK" "$RUNNER_TEMP/sportreel-pr203.apk"
      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Start Metro bundler
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          nohup npx expo start --localhost --non-interactive > "$RUNNER_TEMP/metro.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/metro.pid"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"; then
              echo "Metro is ready on 127.0.0.1:8081"
              exit 0
            fi
            sleep 2
          done
          echo "Metro failed to become ready" >&2
          cat "$RUNNER_TEMP/metro.log" >&2 || true
          exit 1

      - name: Create APP-01 runtime script
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/app01.sh" <<'SH'
          set -euo pipefail
          OUT="$RUNNER_TEMP/app01"
          mkdir -p "$OUT"
          collect() {
            set +e
            adb exec-out screencap -p > "$OUT/final.png" 2>/dev/null
            adb exec-out uiautomator dump /dev/tty > "$OUT/final-ui.xml" 2>/dev/null
            adb logcat -d > "$OUT/logcat.txt" 2>/dev/null
            adb logcat -b crash -d > "$OUT/crash-logcat.txt" 2>/dev/null
          }
          trap collect EXIT
          adb wait-for-device
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running"
          adb reverse tcp:8081 tcp:8081
          adb reverse --list | tee "$OUT/adb-reverse.txt"
          adb install -r "$RUNNER_TEMP/sportreel-pr203.apk" | tee "$OUT/install.txt"
          adb shell pm clear "$APP_ID" >/dev/null
          adb logcat -c
          ACTIVITY=$(adb shell cmd package resolve-activity --brief "$APP_ID" | tr -d '\r' | tail -n1)
          test -n "$ACTIVITY"
          echo "$ACTIVITY" > "$OUT/activity.txt"
          # Keep launcher/system UI failures from obscuring the app under test.
          adb shell am force-stop com.google.android.apps.nexuslauncher || true
          adb shell am force-stop com.android.launcher3 || true
          adb shell am force-stop "$APP_ID"
          adb shell am start -n "$ACTIVITY" | tee "$OUT/launch.txt"
          OK=0
          for i in $(seq 1 45); do
            adb exec-out uiautomator dump /dev/tty > "$OUT/login-ui.xml" 2>/dev/null || true
            if grep -Fq "Welcome Back" "$OUT/login-ui.xml"; then OK=1; break; fi
            # Dismiss Android ANR/crash dialogs that can cover SportReel in CI.
            if grep -Eq "isn't responding|is not responding|Close app|Wait|keeps stopping" "$OUT/login-ui.xml"; then
              cp "$OUT/login-ui.xml" "$OUT/system-dialog-$i.xml" || true
              adb exec-out screencap -p > "$OUT/system-dialog-$i.png" 2>/dev/null || true
              # Prefer Wait when present; otherwise dismiss the dialog and relaunch SportReel.
              if grep -Fq 'text="Wait"' "$OUT/login-ui.xml"; then
                adb shell input tap 825 1130 || true
              else
                adb shell input keyevent 4 || true
              fi
              adb shell am start -n "$ACTIVITY" >/dev/null 2>&1 || true
            fi
            sleep 2
          done
          adb exec-out screencap -p > "$OUT/login.png"
          adb logcat -d > "$OUT/post-launch-logcat.txt"
          if grep -Fq "supabaseUrl is required" "$OUT/post-launch-logcat.txt"; then
            echo "APP-01 FAIL: legacy Supabase configuration crash observed" >&2
            exit 1
          fi
          if grep -q "FATAL EXCEPTION" "$OUT/post-launch-logcat.txt"; then
            echo "APP-01 FAIL: fatal exception observed" >&2
            exit 1
          fi
          test "$OK" = "1" || { echo "APP-01 FAIL: Welcome Back not visible" >&2; exit 1; }
          cat > "$OUT/evidence.json" <<EOF
          {"experiment":"APP-01","tested_commit":"$TESTED_SHA","app_id":"$APP_ID","expected_screen":"Welcome Back","legacy_supabase_crash":false,"status":"PASS"}
          EOF
          SH
          chmod +x "$RUNNER_TEMP/app01.sh"
      - name: Run APP-01 on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          disable-linux-hw-accel: false
          script: bash "$RUNNER_TEMP/app01.sh"
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr203-app01-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/app01/
            ${{ runner.temp }}/apk.sha256
            ${{ runner.temp }}/tested-commit.txt
            ${{ runner.temp }}/metro.log
          if-no-files-found: warn
          retention-days: 30
