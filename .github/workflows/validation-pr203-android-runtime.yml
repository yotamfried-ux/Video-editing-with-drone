name: Validation Authenticated Android Journey
on:
  push:
    branches: [validation/pr203-app-runtime]
    paths: [.github/workflows/validation-pr203-android-runtime.yml]
permissions:
  contents: read
  pull-requests: write
jobs:
  authenticated-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ID: com.sportreel.app
      TESTED_SHA: b76cdd5e9434d5f2f681cc5a2f485f247996cda0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install JS dependencies
        working-directory: mobile
        run: npm ci
      - name: Restore exact APK checkpoint
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sportreel-pr203.apk
          key: sportreel-android-debug-${{ env.TESTED_SHA }}-v2
      - name: Require checkpoint
        run: test "${{ steps.apk-cache.outputs.cache-hit }}" = "true" && test -f "$RUNNER_TEMP/sportreel-pr203.apk"
      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Start Metro
        working-directory: mobile
        run: |
          nohup npx expo start --localhost --non-interactive > "$RUNNER_TEMP/metro.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running" && exit 0; sleep 2; done
          exit 1
      - name: Create confirmed test user
        id: test-user
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          EMAIL="sportreel.e2e+${GITHUB_RUN_ID}@example.com"
          PASSWORD="E2e-${GITHUB_RUN_ID}-Aa9!"
          RESPONSE=$(curl -fsS -X POST "https://bcndgmymnismbxvdeetc.supabase.co/auth/v1/admin/users" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg e "$EMAIL" --arg p "$PASSWORD" '{email:$e,password:$p,email_confirm:true}')")
          USER_ID=$(printf '%s' "$RESPONSE" | jq -r '.id')
          test -n "$USER_ID" && test "$USER_ID" != "null"
          {
            echo "email=$EMAIL"
            echo "user_id=$USER_ID"
            echo "password=$PASSWORD"
          } >> "$GITHUB_OUTPUT"
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$PASSWORD"
          echo "::add-mask::$USER_ID"

      - name: Create targeted APP-03 to APP-06 script
        env:
          TEST_EMAIL: ${{ steps.test-user.outputs.email }}
          TEST_PASSWORD: ${{ steps.test-user.outputs.password }}
        run: |
          cat > "$RUNNER_TEMP/journey.sh" <<'SH'
          set -euo pipefail
          ROOT="$RUNNER_TEMP/android-evidence"; mkdir -p "$ROOT"/{APP-03,APP-04,APP-05,APP-06}
          dump_ui(){ local d="$1"; mkdir -p "$(dirname "$d")"; adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || return 0; adb pull /sdcard/window.xml "$d" >/dev/null 2>&1 || true; }
          wait_text(){ local t="$1" d="$2"; for i in $(seq 1 45); do dump_ui "$d"; [ -f "$d" ] && grep -Fq "$t" "$d" && return 0; if [ "$i" = 12 ] || [ "$i" = 28 ]; then adb shell am start -n "$ACTIVITY" >/dev/null 2>&1 || true; fi; sleep 2; done; return 1; }
          bounds(){ grep -o "text=\"$2\"[^>]*bounds=\"[^\"]*\"" "$1" | head -n1 | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p'; }
          tap(){ local b; b=$(bounds "$1" "$2"); test -n "$b"; read a b1 c d <<< "$b"; adb shell input tap $(((a+c)/2)) $(((b1+d)/2)); }
          desc_bounds(){ grep -o 'content-desc="[^"]*'"$2"'[^"]*"[^>]*bounds="[^"]*"' "$1" | head -n1 | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p'; }
          tap_desc(){ local b; b=$(desc_bounds "$1" "$2"); test -n "$b"; read a b1 c d <<< "$b"; adb shell input tap $(((a+c)/2)) $(((b1+d)/2)); }
          edits(){ grep -o 'class="android.widget.EditText"[^>]*bounds="[^"]*"' "$1" | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p'; }
          type_at(){ local q="$1" v="$2"; read a b c d <<< "$q"; adb shell input tap $(((a+c)/2)) $(((b+d)/2)); sleep 1; adb shell input text "$v"; }
          adb wait-for-device; adb reverse tcp:8081 tcp:8081
          adb install -r "$RUNNER_TEMP/sportreel-pr203.apk" >/dev/null; adb shell pm clear "$APP_ID" >/dev/null
          ACTIVITY=$(adb shell cmd package resolve-activity --brief "$APP_ID" | tr -d '\r' | tail -n1); adb shell am start -n "$ACTIVITY" >/dev/null
          # A text-only readiness check can race React Native startup: the native window may exist
          # before its editable nodes are exposed. Wait for the complete actionable login surface.
          LOGIN_READY=0
          for i in $(seq 1 90); do
            dump_ui "$ROOT/APP-03/login.xml"
            if grep -Fq "Welcome Back" "$ROOT/APP-03/login.xml" 2>/dev/null; then
              mapfile -t L < <(edits "$ROOT/APP-03/login.xml")
              if test "${#L[@]}" -ge 2; then LOGIN_READY=1; break; fi
            fi
            if [ "$i" = 30 ] || [ "$i" = 60 ]; then adb shell am start -n "$ACTIVITY" >/dev/null 2>&1 || true; fi
            sleep 2
          done
          test "$LOGIN_READY" = 1
          EMAIL="$TEST_EMAIL"; PASSWORD="$TEST_PASSWORD"
          type_at "${L[0]}" "$EMAIL"
          # Keyboard opening can move the React Native window. Rediscover Password using
          # current bounds instead of TAB or stale pre-keyboard coordinates. Keep this
          # transient tree outside the evidence directory because it may contain input state.
          TRANSIENT="$RUNNER_TEMP/login-keyboard.xml"; P=""
          for _ in {1..20}; do
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml "$TRANSIENT" >/dev/null 2>&1 || true
            if test -s "$TRANSIENT"; then
              mapfile -t K < <(edits "$TRANSIENT")
              if test "${#K[@]}" -ge 2; then P="${K[1]}"; break; fi
            fi
          done
          test -n "$P"; type_at "$P" "$PASSWORD"; adb shell input keyevent 4
          sleep 1
          dump_ui "$ROOT/APP-03/login-ready.xml"; tap "$ROOT/APP-03/login-ready.xml" "Sign In"; wait_text "Your Name" "$ROOT/APP-03/result.xml"
          printf '{"experiment":"APP-03","status":"PASS"}\n' > "$ROOT/APP-03/evidence.json"
          mapfile -t N < <(edits "$ROOT/APP-03/result.xml"); type_at "${N[0]}" "SportReel_Validation"; adb shell input keyevent 4; dump_ui "$ROOT/APP-04/filled.xml"; tap "$ROOT/APP-04/filled.xml" "Finish"
          wait_text "Catch your moments" "$ROOT/APP-04/discover.xml"; printf '{"experiment":"APP-04","status":"PASS"}\n' > "$ROOT/APP-04/evidence.json"
          tap "$ROOT/APP-04/discover.xml" "Profile"
          # The Profile shell renders before useProfile() finishes its asynchronous Supabase read.
          # Wait for the persisted value itself, not for static chrome such as "Save Name".
          wait_text "SportReel_Validation" "$ROOT/APP-05/profile.xml"
          adb shell am force-stop "$APP_ID"; adb shell am start -n "$ACTIVITY" >/dev/null; wait_text "Catch your moments" "$ROOT/APP-05/relaunch.xml"; ! grep -Fq "Welcome Back" "$ROOT/APP-05/relaunch.xml"
          printf '{"experiment":"APP-05","session_persisted":true,"status":"PASS"}\n' > "$ROOT/APP-05/evidence.json"
          sleep 2; dump_ui "$RUNNER_TEMP/relaunch-stable.xml"; tap "$RUNNER_TEMP/relaunch-stable.xml" "Profile"; wait_text "Sign Out" "$ROOT/APP-06/profile.xml"; tap "$ROOT/APP-06/profile.xml" "Sign Out"
          # Sign-out intentionally leaves the user on the unauthenticated Profile state.
          # Verify that state, then follow the visible Sign In CTA to the login screen.
          wait_text "Sign in to view your profile" "$ROOT/APP-06/signed-out-profile.xml"
          tap "$ROOT/APP-06/signed-out-profile.xml" "Sign In"; wait_text "Welcome Back" "$ROOT/APP-06/login.xml"
          # Re-login with the same confirmed fixture. Because APP-04 already persisted the profile name,
          # a successful login must route directly to Discover rather than returning to onboarding.
          mapfile -t R < <(edits "$ROOT/APP-06/login.xml"); type_at "${R[0]}" "$EMAIL"
          REL="$RUNNER_TEMP/relogin-keyboard.xml"; RP=""
          for _ in {1..20}; do
            sleep 1; adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true; adb pull /sdcard/window.xml "$REL" >/dev/null 2>&1 || true
            if test -s "$REL"; then mapfile -t RK < <(edits "$REL"); if test "${#RK[@]}" -ge 2; then RP="${RK[1]}"; break; fi; fi
          done
          test -n "$RP"; type_at "$RP" "$PASSWORD"; adb shell input keyevent 4; sleep 1
          dump_ui "$ROOT/APP-06/relogin-ready.xml"; tap "$ROOT/APP-06/relogin-ready.xml" "Sign In"
          wait_text "Catch your moments" "$ROOT/APP-06/result.xml"; ! grep -Fq "Your Name" "$ROOT/APP-06/result.xml"
          printf '{"experiment":"APP-06","signed_out":true,"relogin":true,"onboarding_skipped":true,"status":"PASS"}\n' > "$ROOT/APP-06/evidence.json"
          # UI-01: authenticated Discover renders its real empty-state content.
          mkdir -p "$ROOT/UI-01" "$ROOT/UI-02" "$ROOT/UI-03" "$ROOT/DATA-01"
          wait_text "No sessions yet" "$ROOT/UI-01/discover.xml"; grep -Fq "Check back after a session!" "$ROOT/UI-01/discover.xml"
          printf '{"experiment":"UI-01","discover_empty_state":true,"status":"PASS"}\n' > "$ROOT/UI-01/evidence.json"

          # UI-02: both support entry points are reachable from the authenticated Profile screen.
          tap "$ROOT/UI-01/discover.xml" "Profile"; wait_text "Contact Support" "$ROOT/UI-02/profile.xml"
          tap "$ROOT/UI-02/profile.xml" "Contact Support"; wait_text "Describe your issue" "$ROOT/UI-02/support.xml"; adb shell input keyevent 4
          wait_text "Suggest a Clip Improvement" "$ROOT/UI-02/profile-return.xml"; tap "$ROOT/UI-02/profile-return.xml" "Suggest a Clip Improvement"
          wait_text "Your idea" "$ROOT/UI-02/suggest.xml"; adb shell input keyevent 4
          printf '{"experiment":"UI-02","support_routes":true,"status":"PASS"}\n' > "$ROOT/UI-02/evidence.json"

          # UI-03: Profile remains editable after the complete auth lifecycle.
          wait_text "Save Name" "$ROOT/UI-03/profile.xml"; grep -Fq "SportReel_Validation" "$ROOT/UI-03/profile.xml"
          printf '{"experiment":"UI-03","profile_edit_surface":true,"status":"PASS"}\n' > "$ROOT/UI-03/evidence.json"

          # DATA-01: verify the persisted profile through the real authenticated Supabase client path.
          # APP-05/06 already prove the value survives restart and a fresh sign-in; preserve those UI artifacts
          # as DATA-01 evidence without using service-role reads that would bypass RLS.
          cp "$ROOT/APP-05/profile.xml" "$ROOT/DATA-01/profile-before-relogin.xml"
          cp "$ROOT/UI-03/profile.xml" "$ROOT/DATA-01/profile-after-relogin.xml"
          grep -Fq "SportReel_Validation" "$ROOT/DATA-01/profile-before-relogin.xml"
          grep -Fq "SportReel_Validation" "$ROOT/DATA-01/profile-after-relogin.xml"
          printf '{"experiment":"DATA-01","profile_persisted_through_authenticated_client":true,"status":"PASS"}\n' > "$ROOT/DATA-01/evidence.json"

          # DATA-02/03: exercise the actual authenticated app writes. The service-role is used only
          # later for independent evidence/cleanup; the writes themselves go through the user's JWT/RLS.
          mkdir -p "$ROOT/DATA-02" "$ROOT/DATA-03"
          tap "$ROOT/UI-03/profile.xml" "Contact Support"; wait_text "Describe your issue" "$ROOT/DATA-02/form.xml"
          mapfile -t S < <(edits "$ROOT/DATA-02/form.xml"); type_at "${S[0]}" "E2E_support_${GITHUB_RUN_ID}"; adb shell input keyevent 4
          dump_ui "$ROOT/DATA-02/filled.xml"; tap "$ROOT/DATA-02/filled.xml" "Send Message"; wait_text "Sent!" "$ROOT/DATA-02/result.xml"
          # React Native Alert on Android is dismissed by its positive button; Back is not a reliable
          # dismissal path for a non-cancelable default alert. Exercise the visible OK action.
          tap "$ROOT/DATA-02/result.xml" "OK"; wait_text "Contact Support" "$ROOT/DATA-02/profile-return.xml"
          tap "$ROOT/DATA-02/profile-return.xml" "Suggest a Clip Improvement"; wait_text "Your idea" "$ROOT/DATA-03/form.xml"
          mapfile -t G < <(edits "$ROOT/DATA-03/form.xml"); type_at "${G[0]}" "E2E_suggestion_${GITHUB_RUN_ID}"; adb shell input keyevent 4
          dump_ui "$ROOT/DATA-03/filled.xml"; tap "$ROOT/DATA-03/filled.xml" "Send Suggestion"; wait_text "Thank you!" "$ROOT/DATA-03/result.xml"
          tap "$ROOT/DATA-03/result.xml" "OK"
          printf '{"experiment":"DATA-02","authenticated_support_insert":true,"status":"PASS"}\n' > "$ROOT/DATA-02/evidence.json"
          printf '{"experiment":"DATA-03","authenticated_suggestion_insert":true,"status":"PASS"}\n' > "$ROOT/DATA-03/evidence.json"
          SH
          chmod +x "$RUNNER_TEMP/journey.sh"
      - name: Run targeted journey
        id: journey
        env:
          TEST_EMAIL: ${{ steps.test-user.outputs.email }}
          TEST_PASSWORD: ${{ steps.test-user.outputs.password }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          script: bash "$RUNNER_TEMP/journey.sh"
      - name: Verify backend writes and RLS evidence
        if: steps.journey.outcome == 'success'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_ID: ${{ steps.test-user.outputs.user_id }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/android-evidence"; mkdir -p "$ROOT/DATA-02" "$ROOT/DATA-03"
          SUPPORT="E2E_support_${GITHUB_RUN_ID}"
          SUGGESTION="E2E_suggestion_${GITHUB_RUN_ID}"
          H=(-H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          T=$(curl -fsS -G "https://bcndgmymnismbxvdeetc.supabase.co/rest/v1/support_tickets" "${H[@]}" --data-urlencode "select=id,user_id,message,status" --data-urlencode "user_id=eq.$TEST_USER_ID" --data-urlencode "message=eq.$SUPPORT")
          G=$(curl -fsS -G "https://bcndgmymnismbxvdeetc.supabase.co/rest/v1/suggestions" "${H[@]}" --data-urlencode "select=id,user_id,message" --data-urlencode "user_id=eq.$TEST_USER_ID" --data-urlencode "message=eq.$SUGGESTION")
          test "$(jq 'length' <<<"$T")" = 1; test "$(jq -r '.[0].status' <<<"$T")" = open
          test "$(jq 'length' <<<"$G")" = 1
          jq -n '{experiment:"DATA-02",backend_row_verified:true,rls_path:"authenticated-app-write",status:"PASS"}' > "$ROOT/DATA-02/backend-evidence.json"
          jq -n '{experiment:"DATA-03",backend_row_verified:true,rls_path:"authenticated-app-write",status:"PASS"}' > "$ROOT/DATA-03/backend-evidence.json"
          curl -fsS -X DELETE "https://bcndgmymnismbxvdeetc.supabase.co/rest/v1/support_tickets?user_id=eq.$TEST_USER_ID&message=eq.$SUPPORT" "${H[@]}" >/dev/null
          curl -fsS -X DELETE "https://bcndgmymnismbxvdeetc.supabase.co/rest/v1/suggestions?user_id=eq.$TEST_USER_ID&message=eq.$SUGGESTION" "${H[@]}" >/dev/null

      - name: Verify negative RLS boundaries and Sessions API contract
        if: steps.journey.outcome == 'success'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_EMAIL: ${{ steps.test-user.outputs.email }}
          TEST_PASSWORD: ${{ steps.test-user.outputs.password }}
          TEST_USER_ID: ${{ steps.test-user.outputs.user_id }}
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/android-evidence"; mkdir -p "$ROOT/SEC-01" "$ROOT/API-01"
          ANON_KEY=$(sed -n "s/.*'\(sb_publishable_[^']*\)'.*/\1/p" mobile/src/shared/lib/publicEnv.ts | head -n1)
          test -n "$ANON_KEY"
          LOGIN=$(curl -fsS -X POST "https://bcndgmymnismbxvdeetc.supabase.co/auth/v1/token?grant_type=password" -H "apikey: $ANON_KEY" -H "Content-Type: application/json" --data "$(jq -nc --arg e "$TEST_EMAIL" --arg p "$TEST_PASSWORD" '{email:$e,password:$p}')")
          JWT=$(jq -r '.access_token' <<<"$LOGIN"); test -n "$JWT" && test "$JWT" != null; echo "::add-mask::$JWT"
          AUTH=(-H "apikey: $ANON_KEY" -H "Authorization: Bearer $JWT" -H "Content-Type: application/json")
          OTHER_EMAIL="sportreel.rls.other+${GITHUB_RUN_ID}@example.com"; OTHER_PASSWORD="Rls-${GITHUB_RUN_ID}-Aa9!"
          OTHER=$(curl -fsS -X POST "https://bcndgmymnismbxvdeetc.supabase.co/auth/v1/admin/users" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" -H "Content-Type: application/json" --data "$(jq -nc --arg e "$OTHER_EMAIL" --arg p "$OTHER_PASSWORD" '{email:$e,password:$p,email_confirm:true}')")
          OTHER_ID=$(jq -r '.id' <<<"$OTHER"); test -n "$OTHER_ID" && test "$OTHER_ID" != null; echo "::add-mask::$OTHER_ID"
          trap 'curl -fsS -X DELETE "https://bcndgmymnismbxvdeetc.supabase.co/auth/v1/admin/users/$OTHER_ID" -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" >/dev/null || true' EXIT
          OWN=$(curl -fsS -G "https://bcndgmymnismbxvdeetc.supabase.co/rest/v1/athlete_profiles" "${AUTH[@]}" --data-urlencode "select=user_id" --data-urlencode "user_id=eq.$TEST_USER_ID")
          FOREIGN=$(curl -fsS -G "https://bcndgmymnismbxvdeetc.supabase.co/rest/v1/athlete_profiles" "${AUTH[@]}" --data-urlencode "select=user_id" --data-urlencode "user_id=eq.$OTHER_ID")
          test "$(jq 'length' <<<"$OWN")" = 1; test "$(jq 'length' <<<"$FOREIGN")" = 0
          CODE=$(curl -sS -o "$RUNNER_TEMP/rls-spoof.json" -w '%{http_code}' -X POST "https://bcndgmymnismbxvdeetc.supabase.co/rest/v1/support_tickets" "${AUTH[@]}" -H "Prefer: return=representation" --data "$(jq -nc --arg u "$OTHER_ID" '{user_id:$u,message:"RLS spoof attempt"}')")
          test "$CODE" -ge 400
          CODE2=$(curl -sS -o "$RUNNER_TEMP/rls-spoof-suggestion.json" -w '%{http_code}' -X POST "https://bcndgmymnismbxvdeetc.supabase.co/rest/v1/suggestions" "${AUTH[@]}" -H "Prefer: return=representation" --data "$(jq -nc --arg u "$OTHER_ID" '{user_id:$u,message:"RLS spoof attempt"}')")
          test "$CODE2" -ge 400
          jq -n --arg support_http "$CODE" --arg suggestion_http "$CODE2" '{experiment:"SEC-01",own_profile_visible:true,foreign_profile_hidden:true,spoofed_support_rejected:true,spoofed_suggestion_rejected:true,support_http:$support_http,suggestion_http:$suggestion_http,status:"PASS"}' > "$ROOT/SEC-01/evidence.json"
          SESS=$(curl -fsS "https://video-editing-with-drone.vercel.app/api/sessions?page=1&limit=20")
          jq -e '.sessions | type == "array"' <<<"$SESS" >/dev/null
          jq -e '.hasMore | type == "boolean"' <<<"$SESS" >/dev/null
          jq -e '[.sessions[] | has("recording_date") and has("sport") and (.reels|type=="array")] | all' <<<"$SESS" >/dev/null
          jq -n --argjson count "$(jq '[.sessions[].reels[]] | length' <<<"$SESS")" --argjson hasMore "$(jq '.hasMore' <<<"$SESS")" '{experiment:"API-01",sessions_contract:true,reel_count:$count,hasMore:$hasMore,status:"PASS"}' > "$ROOT/API-01/evidence.json"

      - name: R2-01 real single-PUT upload, verification, and idempotency
        if: steps.journey.outcome == 'success'
        env:
          OPERATOR_SECRET: ${{ secrets.PRODUCTION_OPERATOR_SECRET || secrets.OPERATOR_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPERATOR_SECRET"
          echo "::add-mask::$OPERATOR_SECRET"
          ROOT="$RUNNER_TEMP/android-evidence/R2-01"; mkdir -p "$ROOT"
          API="https://video-editing-with-drone.vercel.app"
          CID="validation_${GITHUB_RUN_ID}_r2_single_put"
          FILE="$RUNNER_TEMP/r2-01-source.bin"
          printf 'SportReel R2 validation run %s\n' "$GITHUB_RUN_ID" > "$FILE"
          SIZE=$(wc -c < "$FILE" | tr -d ' ')
          BODY=$(jq -nc --arg cid "$CID" --argjson size "$SIZE" '{client_upload_id:$cid,filename:"validation-r2-01.mp4",mimeType:"video/mp4",size:$size}')
          INIT=$(curl -fsS -X POST "$API/api/operator/upload" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$BODY")
          test "$(jq -r '.storage_backend' <<<"$INIT")" = "r2"
          URL=$(jq -r '.uploadUrl' <<<"$INIT"); KEY=$(jq -r '.storage_key' <<<"$INIT"); UPLOAD_ID=$(jq -r '.upload_id' <<<"$INIT"); BATCH_ID=$(jq -r '.batch_id' <<<"$INIT")
          test -n "$URL"; test -n "$KEY"; test -n "$UPLOAD_ID"; test -n "$BATCH_ID"
          # Presigned URL is a bearer capability: never write it to evidence or logs.
          curl -fsS -X PUT "$URL" -H "Content-Type: video/mp4" --data-binary "@$FILE" >/dev/null
          VERIFY=$(curl -fsS -X POST "$API/api/operator/upload/verify" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$(jq -nc --arg k "$KEY" '{storage_key:$k}')")
          test "$(jq -r '.ok' <<<"$VERIFY")" = true
          test "$(jq -r '.exists' <<<"$VERIFY")" = true
          test "$(jq -r '.upload_status' <<<"$VERIFY")" = verified
          test "$(jq -r '.size' <<<"$VERIFY")" = "$SIZE"
          RETRY=$(curl -fsS -X POST "$API/api/operator/upload" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$BODY")
          test "$(jq -r '.upload_id' <<<"$RETRY")" = "$UPLOAD_ID"
          test "$(jq -r '.storage_key' <<<"$RETRY")" = "$KEY"
          test "$(jq -r '.batch_id' <<<"$RETRY")" = "$BATCH_ID"
          test "$(jq -r '.upload_status' <<<"$RETRY")" = verified
          jq -n --arg upload_id "$UPLOAD_ID" --arg batch_id "$BATCH_ID" --arg storage_key "$KEY" --argjson size "$SIZE" '{experiment:"R2-01",storage_backend:"r2",real_put:true,head_verified:true,manifest_verified:true,idempotent_retry:true,upload_id:$upload_id,batch_id:$batch_id,storage_key:$storage_key,size_bytes:$size,status:"PASS"}' > "$ROOT/evidence.json"

      - name: R2-02 multipart interruption, resume, retry, and completion
        if: steps.journey.outcome == 'success'
        env:
          OPERATOR_SECRET: ${{ secrets.PRODUCTION_OPERATOR_SECRET || secrets.OPERATOR_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPERATOR_SECRET"; echo "::add-mask::$OPERATOR_SECRET"
          ROOT="$RUNNER_TEMP/android-evidence/R2-02"; mkdir -p "$ROOT"
          API="https://video-editing-with-drone.vercel.app"
          CID="validation_${GITHUB_RUN_ID}_r2_multipart"
          PART=$((5*1024*1024)); LAST=$((1024*1024)); TOTAL=$((PART+LAST))
          P1="$RUNNER_TEMP/r2-part1.bin"; P2="$RUNNER_TEMP/r2-part2.bin"
          head -c "$PART" /dev/zero | tr '\0' 'A' > "$P1"
          head -c "$LAST" /dev/zero | tr '\0' 'B' > "$P2"
          START_BODY=$(jq -nc --arg cid "$CID" --argjson size "$TOTAL" --argjson part "$PART" '{client_upload_id:$cid,filename:"validation-r2-02.mp4",mimeType:"video/mp4",size:$size,part_size_bytes:$part,local_cleanup_required:false}')
          START=$(curl -fsS -X POST "$API/api/operator/upload/multipart/start" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$START_BODY")
          UPLOAD_ID=$(jq -r '.upload_id' <<<"$START"); BATCH_ID=$(jq -r '.batch_id' <<<"$START"); KEY=$(jq -r '.storage_key' <<<"$START")
          test "$(jq -r '.expected_part_count' <<<"$START")" = 2
          U1=$(curl -fsS -X POST "$API/api/operator/upload/multipart/part-url" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$(jq -nc --arg u "$UPLOAD_ID" '{upload_id:$u,part_number:1}')")
          URL1=$(jq -r '.upload_url' <<<"$U1"); test -n "$URL1"
          HDR="$RUNNER_TEMP/r2-part1.headers"; curl -fsS -D "$HDR" -o /dev/null -X PUT "$URL1" --data-binary "@$P1"
          ETAG1=$(awk 'BEGIN{IGNORECASE=1} /^etag:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$HDR"); test -n "$ETAG1"
          REC1=$(curl -fsS -X POST "$API/api/operator/upload/multipart/record-part" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$(jq -nc --arg u "$UPLOAD_ID" --arg e "$ETAG1" --argjson s "$PART" '{upload_id:$u,part_number:1,etag:$e,size_bytes:$s}')")
          test "$(jq -r '.completed_part_count' <<<"$REC1")" = 1

          # Simulated interruption: discard all presigned URLs and recover only from durable identifiers.
          STATUS=$(curl -fsS -X POST "$API/api/operator/upload/multipart/status" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$(jq -nc --arg u "$UPLOAD_ID" --arg b "$BATCH_ID" --arg k "$KEY" '{upload_id:$u,batch_id:$b,storage_key:$k}')")
          test "$(jq -r '.completed_part_count' <<<"$STATUS")" = 1
          test "$(jq -r '.completed_parts[0].part_number' <<<"$STATUS")" = 1
          RESUME=$(curl -fsS -X POST "$API/api/operator/upload/multipart/start" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$START_BODY")
          test "$(jq -r '.resumed_existing_start' <<<"$RESUME")" = true
          test "$(jq -r '.upload_id' <<<"$RESUME")" = "$UPLOAD_ID"

          U2=$(curl -fsS -X POST "$API/api/operator/upload/multipart/part-url" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$(jq -nc --arg u "$UPLOAD_ID" '{upload_id:$u,part_number:2}')")
          URL2=$(jq -r '.upload_url' <<<"$U2"); HDR2="$RUNNER_TEMP/r2-part2.headers"
          curl -fsS -D "$HDR2" -o /dev/null -X PUT "$URL2" --data-binary "@$P2"
          ETAG2=$(awk 'BEGIN{IGNORECASE=1} /^etag:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$HDR2"); test -n "$ETAG2"
          # Retry the same part and persist the latest successful ETag.
          HDR2R="$RUNNER_TEMP/r2-part2-retry.headers"; curl -fsS -D "$HDR2R" -o /dev/null -X PUT "$URL2" --data-binary "@$P2"
          ETAG2R=$(awk 'BEGIN{IGNORECASE=1} /^etag:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' "$HDR2R"); test -n "$ETAG2R"
          REC2=$(curl -fsS -X POST "$API/api/operator/upload/multipart/record-part" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$(jq -nc --arg u "$UPLOAD_ID" --arg e "$ETAG2R" --argjson s "$LAST" '{upload_id:$u,part_number:2,etag:$e,size_bytes:$s}')")
          test "$(jq -r '.completed_part_count' <<<"$REC2")" = 2
          DONE=$(curl -fsS -X POST "$API/api/operator/upload/multipart/complete" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$(jq -nc --arg u "$UPLOAD_ID" '{upload_id:$u}')")
          test "$(jq -r '.ok' <<<"$DONE")" = true
          test "$(jq -r '.upload_status' <<<"$DONE")" = verified
          test "$(jq -r '.verified_size_bytes' <<<"$DONE")" = "$TOTAL"
          FINAL=$(curl -fsS -X POST "$API/api/operator/upload/multipart/status" -H "x-operator-secret: $OPERATOR_SECRET" -H "Content-Type: application/json" --data "$(jq -nc --arg u "$UPLOAD_ID" '{upload_id:$u}')")
          test "$(jq -r '.status' <<<"$FINAL")" = verified
          test "$(jq -r '.completed_part_count' <<<"$FINAL")" = 2
          jq -n --arg upload_id "$UPLOAD_ID" --arg batch_id "$BATCH_ID" --arg storage_key "$KEY" --argjson size "$TOTAL" '{experiment:"R2-02",real_multipart:true,interruption_simulated:true,durable_resume:true,retried_part:true,completed:true,manifest_verified:true,upload_id:$upload_id,batch_id:$batch_id,storage_key:$storage_key,size_bytes:$size,status:"PASS"}' > "$ROOT/evidence.json"

      - name: Delete test user
        if: always() && steps.test-user.outputs.user_id != ''
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_ID: ${{ steps.test-user.outputs.user_id }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X DELETE "https://bcndgmymnismbxvdeetc.supabase.co/auth/v1/admin/users/$TEST_USER_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" >/dev/null

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-journey-${{ github.run_id }}
          path: ${{ runner.temp }}/android-evidence/
          retention-days: 7

      - name: Notify validation controller
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOURNEY_OUTCOME: ${{ steps.journey.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf -v BODY 'SPORTREEL_VALIDATION_COMPLETED\nrun_id=%s\noutcome=%s\nhead_sha=%s\nrun_url=%s' \
            "${{ github.run_id }}" "$JOURNEY_OUTCOME" "${{ github.sha }}" "$RUN_URL"
          gh api "repos/${{ github.repository }}/issues/214/comments" -f body="$BODY" >/dev/null

# trigger after Supabase service-role secret provisioning
