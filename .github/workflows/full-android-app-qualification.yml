name: Full Android App Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'mobile/**'
      - 'web-api/**'
      - 'scripts/app_user_e2e_evidence.py'
      - 'scripts/classify_android_e2e_failure.py'
      - 'scripts/classify_android_e2e_failure.py'
      - 'scripts/app_review_delivery_e2e.py'
      - 'scripts/test_app_review_delivery_e2e_contract.py'
      - '.github/workflows/full-android-app-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'web-api/**'
      - 'scripts/app_user_e2e_evidence.py'
      - 'scripts/app_review_delivery_e2e.py'
      - 'scripts/test_app_review_delivery_e2e_contract.py'
      - '.github/workflows/full-android-app-qualification.yml'

permissions:
  contents: read

concurrency:
  group: full-android-app-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ID: com.sportreel.app
  MAESTRO_VERSION: '2.10.0'
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  prepare-apk:
    name: Prepare Android qualification APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: Validate real delivery qualification contract
        run: python3 scripts/test_app_review_delivery_e2e_contract.py
      - name: Compute native APK cache key
        id: apk-key
        shell: bash
        run: |
          KEY=$(
            {
              printf '%s\0' \
                mobile/package.json \
                mobile/package-lock.json \
                mobile/app.json \
                mobile/google-services.json \
                mobile/scripts/postinstall.js
              find mobile/plugins mobile/modules mobile/assets -type f -print0
            } | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1
          )
          echo "key=app-full-apk-$KEY" >> "$GITHUB_OUTPUT"
      - name: Restore APK checkpoint
        id: apk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sportreel-app-full.apk
          key: ${{ steps.apk-key.outputs.key }}
      - uses: actions/setup-node@v7
        if: steps.apk-cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Build debug APK
        if: steps.apk-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/sportreel-app-full.apk"
      - name: Save APK checkpoint
        if: steps.apk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sportreel-app-full.apk
          key: ${{ steps.apk-key.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-full-apk-${{ github.run_id }}
          path: ${{ runner.temp }}/sportreel-app-full.apk
          retention-days: 1
          if-no-files-found: error


  operator-readonly:
    name: Android operator read-only / API navigation
    needs: prepare-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: app-full-apk-${{ github.run_id }}
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies for Metro
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Start Metro in operator validation mode
        working-directory: mobile
        env:
          EXPO_PUBLIC_UPL01_OPERATOR_BYPASS: '1'
        run: |
          nohup npx expo start --localhost --non-interactive > "$RUNNER_TEMP/metro-operator.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/metro-operator.log"
          exit 1
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip"             "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          rm -rf "$HOME/.maestro-cli"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Pre-install Android Emulator with retry
        shell: bash
        run: |
          set -u
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(ls "$sdk"/cmdline-tools/latest/bin/sdkmanager "$sdk"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1 || true)"
          fi
          test -n "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          for attempt in 1 2 3; do
            if "$sdkmanager" --install emulator --channel=0 </dev/null; then exit 0; fi
            echo "::warning::emulator download failed on attempt $attempt; clearing partial download"
            rm -rf "$sdk/emulator" "$sdk/.temp" "$sdk/.downloadIntermediates" || true
            sleep 10
          done
          exit 1
      - name: Run operator read-only Android journey
        env:
          APK: ${{ runner.temp }}/sportreel-app-full.apk
          EVIDENCE_DIR: ${{ runner.temp }}/operator-readonly-evidence
          OPERATOR_SECRET: ${{ secrets.PRODUCTION_OPERATOR_SECRET || secrets.OPERATOR_SECRET }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          script: bash mobile/.maestro/app-e2e/run-operator-readonly.sh
      - name: Upload operator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operator-readonly-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/operator-readonly-evidence/
            ${{ runner.temp }}/metro-operator.log
          retention-days: 30
          if-no-files-found: warn


  review-delivery-discover:
    name: Android Review / Re-edit / Approval / Discover boundary
    needs: prepare-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: app-full-apk-${{ github.run_id }}
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install qualification dependencies
        run: python -m pip install --disable-pip-version-check boto3 requests supabase
      - name: Install mobile dependencies for Metro
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Prepare controlled review fixtures
        env:
          SUPABASE_URL: https://bcndgmymnismbxvdeetc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_KEY_ID }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'sportreel' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg >/dev/null
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=320x180:rate=24 \
            -f lavfi -i sine=frequency=660:sample_rate=48000 -t 2 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$RUNNER_TEMP/review-fixture.mp4"
          {
            echo "E2E_REVIEW_MARKER=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "E2E_REVIEW_FIXTURE_MP4=$RUNNER_TEMP/review-fixture.mp4"
            echo "E2E_REVIEW_STATE_PATH=$RUNNER_TEMP/review-delivery-state.json"
            echo "E2E_REVIEW_EVIDENCE_PATH=$RUNNER_TEMP/review-delivery-evidence.json"
          } >> "$GITHUB_ENV"
          export E2E_REVIEW_MARKER="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export E2E_REVIEW_FIXTURE_MP4="$RUNNER_TEMP/review-fixture.mp4"
          export E2E_REVIEW_STATE_PATH="$RUNNER_TEMP/review-delivery-state.json"
          export E2E_REVIEW_EVIDENCE_PATH="$RUNNER_TEMP/review-delivery-evidence.json"
          python3 scripts/app_review_delivery_e2e.py seed
      - name: Start Metro in operator validation mode
        working-directory: mobile
        env:
          EXPO_PUBLIC_UPL01_OPERATOR_BYPASS: '1'
        run: |
          nohup npx expo start --localhost --non-interactive > "$RUNNER_TEMP/metro-review-delivery.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/metro-review-delivery.log"
          exit 1
      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          rm -rf "$HOME/.maestro-cli"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod 666 /dev/kvm
      - name: Run Review to Discover Android boundary
        id: review-journey
        continue-on-error: true
        env:
          APK: ${{ runner.temp }}/sportreel-app-full.apk
          EVIDENCE_DIR: ${{ runner.temp }}/review-delivery-maestro
          OPERATOR_SECRET: ${{ secrets.PRODUCTION_OPERATOR_SECRET || secrets.OPERATOR_SECRET }}
          SUPABASE_URL: https://bcndgmymnismbxvdeetc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_KEY_ID }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'sportreel' }}
          GITHUB_TOKEN: ${{ github.token }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 480
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          script: bash -lc 'set -o pipefail; bash mobile/.maestro/app-e2e/run-review-delivery.sh 2>&1 | tee "$RUNNER_TEMP/android-review-journey.log"'
      - name: Classify Review Android failure
        if: ${{ failure() && steps.review-journey.outcome == 'failure' }}
        id: classify-review-failure
        shell: bash
        run: |
          {
            echo "=== adb devices ==="
            adb devices -l || true
            echo "=== runner disk ==="
            df -h || true
            echo "=== emulator data ==="
            adb shell df -h /data 2>&1 || true
          } | tee "$RUNNER_TEMP/android-review-infra-diagnostics.log"
          cat "$RUNNER_TEMP/android-review-infra-diagnostics.log" >> "$RUNNER_TEMP/android-review-journey.log"
          if python3 scripts/classify_android_e2e_failure.py --log "$RUNNER_TEMP/android-review-journey.log" --output "$RUNNER_TEMP/android-review-failure-classification.json"; then
            echo "classification=infrastructure" >> "$GITHUB_OUTPUT"
          else
            echo "classification=product_or_test" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail explicit Review product or test regression
        if: ${{ failure() && steps.review-journey.outcome == 'failure' && steps.classify-review-failure.outputs.classification != 'infrastructure' }}
        run: |
          echo "::error::Review Android journey failed without a recognized emulator/runner infrastructure signature."
          exit 1
      - name: Retry Review after classified infrastructure failure
        if: ${{ failure() && steps.review-journey.outcome == 'failure' && steps.classify-review-failure.outputs.classification == 'infrastructure' }}
        env:
          APK: ${{ runner.temp }}/sportreel-app-full.apk
          EVIDENCE_DIR: ${{ runner.temp }}/review-delivery-maestro-retry
          OPERATOR_SECRET: ${{ secrets.PRODUCTION_OPERATOR_SECRET || secrets.OPERATOR_SECRET }}
          SUPABASE_URL: https://bcndgmymnismbxvdeetc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_KEY_ID }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'sportreel' }}
          GITHUB_TOKEN: ${{ github.token }}
          MAESTRO_CLI_NO_ANALYTICS: '1'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 480
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on -wipe-data
          script: bash -lc 'set -o pipefail; bash mobile/.maestro/app-e2e/run-review-delivery.sh 2>&1 | tee "$RUNNER_TEMP/android-review-journey-retry.log"'
      - name: Clean review qualification fixtures
        if: always()
        env:
          SUPABASE_URL: https://bcndgmymnismbxvdeetc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || secrets.ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || secrets.SECRET_KEY_ID }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'sportreel' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/app_review_delivery_e2e.py cleanup
      - name: Upload review-delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-delivery-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/review-delivery-evidence.json
            ${{ runner.temp }}/review-delivery-state.json
            ${{ runner.temp }}/review-delivery-maestro/
            ${{ runner.temp }}/metro-review-delivery.log
          retention-days: 30
          if-no-files-found: warn

  authenticated-user:
    name: Android user / profile / support / RLS
    needs: prepare-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: app-full-apk-${{ github.run_id }}
          path: ${{ runner.temp }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies for Metro
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Prepare isolated test identity and public runtime config
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          env = json.load(open("mobile/eas.json"))["build"]["development"]["env"]
          marker = f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          values = {
              **env,
              "SUPABASE_URL": env["EXPO_PUBLIC_SUPABASE_URL"],
              "SUPABASE_PUBLISHABLE_KEY": env["EXPO_PUBLIC_SUPABASE_ANON_KEY"],
              "E2E_MARKER": marker,
              "E2E_EMAIL": f"sportreel.e2e.{marker}@example.com",
              "E2E_PASSWORD": f"SportReel-E2E-{marker}-Aa9!",
              "E2E_OTHER_EMAIL": f"sportreel.e2e.other.{marker}@example.com",
              "E2E_OTHER_PASSWORD": f"SportReel-E2E-other-{marker}-Aa9!",
              "E2E_STATE_PATH": os.path.join(os.environ["RUNNER_TEMP"], "app-user-e2e-state.json"),
              "APK": os.path.join(os.environ["RUNNER_TEMP"], "sportreel-app-full.apk"),
              "EVIDENCE_DIR": os.path.join(os.environ["RUNNER_TEMP"], "app-user-e2e-evidence"),
          }
          with open(os.environ["GITHUB_ENV"], "a") as out:
              for key, value in values.items():
                  out.write(f"{key}={value}\n")
          PY

      - name: Seed two confirmed Supabase test users
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python3 scripts/app_user_e2e_evidence.py seed \
            --marker "$E2E_MARKER" \
            --email "$E2E_EMAIL" --password "$E2E_PASSWORD" \
            --other-email "$E2E_OTHER_EMAIL" --other-password "$E2E_OTHER_PASSWORD"

      - name: Start Metro with production public endpoints
        working-directory: mobile
        run: |
          nohup npx expo start --localhost --non-interactive > "$RUNNER_TEMP/metro-app-full.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8081/status | grep -q "packager-status:running" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/metro-app-full.log"
          exit 1

      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          rm -rf "$HOME/.maestro-cli"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME/.maestro-cli"
          echo "$HOME/.maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: test -e /dev/kvm && sudo chmod 666 /dev/kvm

      - name: Run authenticated Android journey
        id: android-journey
        continue-on-error: true
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on
          script: bash -lc 'set -o pipefail; bash mobile/.maestro/app-e2e/run-user-journey.sh 2>&1 | tee "$RUNNER_TEMP/android-user-journey.log"'

      - name: Capture and classify Android failure
        if: ${{ !cancelled() && steps.android-journey.outcome == 'failure' }}
        id: classify-failure
        shell: bash
        run: |
          {
            echo "=== adb devices ==="
            adb devices -l || true
            echo "=== runner disk ==="
            df -h || true
            echo "=== emulator data ==="
            adb shell df -h /data 2>&1 || true
            echo "=== recent Android system errors ==="
            adb logcat -d -t 2000 2>&1 | grep -E "FAILED BINDER TRANSACTION|No space left on device|DeviceServerDiedException|FATAL EXCEPTION|AndroidRuntime" || true
          } | tee "$RUNNER_TEMP/android-infra-diagnostics.log"
          cat "$RUNNER_TEMP/android-infra-diagnostics.log" >> "$RUNNER_TEMP/android-user-journey.log"
          if python3 scripts/classify_android_e2e_failure.py --log "$RUNNER_TEMP/android-user-journey.log" --output "$RUNNER_TEMP/android-failure-classification.json"; then
            echo "classification=infrastructure" >> "$GITHUB_OUTPUT"
          else
            echo "classification=product_or_test" >> "$GITHUB_OUTPUT"
          fi

      - name: Retry authenticated journey after classified infrastructure failure
        if: ${{ !cancelled() && steps.android-journey.outcome == 'failure' && steps.classify-failure.outputs.classification == 'infrastructure' }}
        id: android-infra-retry
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 480
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -accel on -wipe-data
          script: bash -lc 'set -o pipefail; bash mobile/.maestro/app-e2e/run-user-journey.sh 2>&1 | tee "$RUNNER_TEMP/android-user-journey-retry.log"'

      - name: Fail explicit product or test regression
        if: ${{ !cancelled() && steps.android-journey.outcome == 'failure' && steps.classify-failure.outputs.classification != 'infrastructure' }}
        run: |
          echo "::error::Authenticated Android journey failed without a recognized emulator/runner infrastructure signature."
          cat "$RUNNER_TEMP/android-failure-classification.json" || true
          exit 1

      - name: Verify UI side effects and cross-user RLS independently
        if: ${{ !cancelled() && (steps.android-journey.outcome == 'success' || steps.android-infra-retry.outcome == 'success') }}
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/app_user_e2e_evidence.py verify

      - name: Clean isolated test data
        if: always()
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/app_user_e2e_evidence.py cleanup

      - name: Upload user-journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-user-e2e-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/app-user-e2e-evidence/
            ${{ runner.temp }}/metro-app-full.log
            ${{ runner.temp }}/android-user-journey*.log
