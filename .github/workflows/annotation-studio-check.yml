name: Annotation Studio Check

# Isolated Ground Truth tool. Runs only when its own files change; touches no production
# secrets, storage, Supabase project, or deployment. Uses synthetic ffmpeg media only.
on:
  pull_request:
    paths:
      - 'annotation-studio/**'
      - 'docs/annotation-studio/**'
      - 'scripts/qualify_gt_export.py'
      - 'pipeline/edl_export.py'
      - 'pipeline/prediction_export.py'
      - '.github/workflows/annotation-studio-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STUDIO_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/postgres
      GEMINI_API_KEY: fixture-not-used
      GOOGLE_SERVICE_ACCOUNT_JSON: fixture-not-used
      RAW_FOLDER_ID: fixture-raw
      PROCESSED_FOLDER_ID: fixture-processed
      REVIEW_FOLDER_ID: fixture-review
      APPROVED_FOLDER_ID: fixture-approved
      OWNER_EMAIL: fixture@example.invalid
    defaults:
      run:
        working-directory: annotation-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check python-dotenv
      - name: Install dependencies (pg is an optional dependency, only used for the PostgreSQL backend)
        run: npm ci --no-audit --no-fund
      - name: Install ffmpeg (synthetic fixtures + proxies)
        # apt on the runner hung for 15+ minutes (2026-11-06, repeatedly). Known slow spots on these images: the man-db
        # trigger after install and an unresponsive mirror during update. Disable the trigger, bound every network
        # read, skip recommends, and keep output visible so a hang shows where it is.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          sudo rm -f /var/lib/man-db/auto-update
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o DPkg::Lock::Timeout=60"
          for i in 1 2 3; do
            if timeout 180 sudo apt-get $APT_OPTS update && timeout 300 sudo apt-get $APT_OPTS install -y --no-install-recommends ffmpeg; then ffmpeg -version | head -1; exit 0; fi
            echo "apt attempt $i failed or hung, retrying"; sleep 10
          done
          exit 1
      - name: Syntax check
        run: npm run check
      - name: Unit + integration + security + qualification tests (SQLite backend)
        run: STUDIO_TEST_DB_URL= npm test
      - name: Same suite on real PostgreSQL + role-isolation / authorization-denial tests
        run: npm test && npm run test:pg
      - name: Browser E2E (Playwright)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          SHOTS_DIR="$RUNNER_TEMP/shots" npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annotation-studio-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
