name: Validation EAS Maestro Qualification

on:
  push:
    branches:
      - validation/eas-maestro-tool-qualification
    paths:
      - .github/workflows/validation-eas-maestro-qualification.yml

permissions:
  contents: read

concurrency:
  group: validation-eas-maestro-tool-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPECTED_APP_SHA: 356d5812097ba935401ecf3a145a2608cda68cb9
      VALIDATION_GIT_REF: validation/eas-maestro-tool-qualification
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Use exact completed Android preview build
        id: exact-build
        shell: bash
        run: |
          echo "build_id=3884d669-850c-4b76-bba5-5e57ffcd2245" >> "$GITHUB_OUTPUT"
          echo "Using exact completed build tied to $EXPECTED_APP_SHA."

      - name: Dispatch and monitor Maestro qualification
        working-directory: mobile
        env:
          BUILD_ID: ${{ steps.exact-build.outputs.build_id }}
        shell: bash
        run: |
          set -uo pipefail

          EVIDENCE="$RUNNER_TEMP/tool-01-eas-maestro.json"
          OUTPUT="$RUNNER_TEMP/eas-workflow-run.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ["RUNNER_TEMP"], "tool-01-eas-maestro.json").write_text(
              json.dumps({
                  "protocol": "sportreel_tool_01_eas_maestro_v1",
                  "tested_app_commit": os.environ["EXPECTED_APP_SHA"],
                  "validation_git_ref": os.environ["VALIDATION_GIT_REF"],
                  "android_build_id": os.environ["BUILD_ID"],
                  "transport": "eas-cli-workflow-run",
                  "secret_values_recorded": False,
                  "status": "dispatching",
              }, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY

          set +e
          eas workflow:run .eas/workflows/tool-qualification.yml \
            -F "build_id=$BUILD_ID" \
            --wait \
            --non-interactive \
            --json > "$OUTPUT"
          CODE=$?
          set -e
          export CLI_EXIT_CODE="$CODE"

          python - <<'PY'
          import json, os
          from pathlib import Path

          evidence_path = Path(os.environ["RUNNER_TEMP"], "tool-01-eas-maestro.json")
          output_path = Path(os.environ["RUNNER_TEMP"], "eas-workflow-run.json")
          evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          raw = output_path.read_text(encoding="utf-8").strip() if output_path.exists() else ""

          if raw:
              try:
                  evidence["cli_result"] = json.loads(raw)
              except json.JSONDecodeError:
                  evidence["cli_result"] = {"unparsed_cli_output_tail": raw[-4000:]}

          code = int(os.environ["CLI_EXIT_CODE"])
          evidence["cli_exit_code"] = code
          evidence["status"] = "success" if code == 0 else "failure"
          evidence_path.write_text(
              json.dumps(evidence, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY

          if [ "$CODE" -ne 0 ]; then
            echo "EAS Maestro qualification failed with CLI exit code $CODE." >&2
            exit "$CODE"
          fi

          echo "TOOL-01 EAS/Maestro qualification succeeded."

      - name: Publish qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-01-eas-maestro-${{ github.run_id }}
          path: ${{ runner.temp }}/tool-01-eas-maestro.json
          if-no-files-found: error
          retention-days: 30
