name: Video Storage Cleanup Check

on:
  pull_request:
    paths:
      - 'web-api/src/lib/video-storage-cleanup*.ts'
      - 'web-api/src/lib/r2-storage.ts'
      - 'web-api/src/app/api/operator/storage/**'
      - 'web-api/scripts/**'
      - 'mobile/src/features/operator/**'
      - 'mobile/.maestro/clean-storage/**'
      - 'scripts/test_video_storage_cleanup_contract.py'
      - 'scripts/video_storage_cleanup_e2e.py'
      - 'scripts/clean_storage_stub_server.py'
      - 'supabase/migrations/20260930_video_storage_cleanup.sql'
      - '.github/workflows/*clean*.yml'
  push:
    branches: [main]
    paths:
      - 'web-api/src/lib/video-storage-cleanup*.ts'
      - 'web-api/src/app/api/operator/storage/**'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static safety contract + harness syntax
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python scripts/test_video_storage_cleanup_contract.py
          python -m py_compile scripts/video_storage_cleanup_e2e.py scripts/clean_storage_stub_server.py
          python - <<'PY'
          import yaml, glob
          for f in glob.glob('.github/workflows/*clean*.yml'):
              yaml.safe_load(open(f))
          PY
          bash -n mobile/.maestro/clean-storage/run-clean-e2e.sh mobile/.maestro/clean-storage/run-clean-failure-ui.sh
      - name: Shared cleanup service unit tests + web-api type-check
        working-directory: web-api
        run: |
          npm ci --no-audit --no-fund
          npx -y tsx --test scripts/video-storage-cleanup.test.ts
          npm run type-check
      - name: Mobile type-check + client tests
        working-directory: mobile
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx jest src/features/operator/lib/cleanVideoStorage.test.ts
