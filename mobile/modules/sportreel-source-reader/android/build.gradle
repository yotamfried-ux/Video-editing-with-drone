apply plugin: 'com.android.library'

group = 'expo.modules.sportreelsourcereader'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(':expo-modules-core').projectDir.absolutePath, 'ExpoModulesCorePlugin.gradle')
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

// Keep the SDK values aligned with the host Expo SDK 52 application.
useDefaultAndroidSdkVersions()

android {
  namespace 'expo.modules.sportreelsourcereader'

  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }

  lintOptions {
    abortOnError false
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
  implementation 'androidx.core:core-ktx:1.13.1'
  testImplementation 'junit:junit:4.13.2'
  // Real org.json on the JVM test classpath (the Android stub jar throws "not mocked").
  testImplementation 'org.json:json:20231013'
}