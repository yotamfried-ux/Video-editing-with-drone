appId: com.sportreel.app
name: APP full - operator read-only navigation
tags: [app-full, operator]
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Operator Secret"
    timeout: 60000
- tapOn:
    id: "operator-secret-input"
- inputText: ${OPERATOR_SECRET}
- hideKeyboard
- tapOn:
    id: "operator-secret-save"
- extendedWaitUntil:
    visible: "Secret is configured on this device"
    timeout: 15000

- tapOn:
    id: "operator-nav-pipeline"
- extendedWaitUntil:
    visible: "Pipeline"
    timeout: 30000
- assertNotVisible: "Operator secret required"

- tapOn:
    id: "operator-nav-review"
- extendedWaitUntil:
    visible: "Review"
    timeout: 30000
- assertNotVisible: "Could not load drafts"

- tapOn:
    id: "operator-nav-analytics"
- extendedWaitUntil:
    visible: "Analytics"
    timeout: 30000

- tapOn:
    id: "operator-nav-pricing"
- extendedWaitUntil:
    visible: "Pricing"
    timeout: 30000

- tapOn:
    id: "operator-nav-reels"
- extendedWaitUntil:
    visible: "Reels"
    timeout: 30000
- assertNotVisible: "Could not load reels"

- swipe:
    from:
      id: "operator-nav-scroll"
    direction: LEFT
    duration: 500
- tapOn:
    id: "operator-nav-support"
- extendedWaitUntil:
    visible: "Support"
    timeout: 30000

- swipe:
    from:
      id: "operator-nav-scroll"
    direction: LEFT
    duration: 500
- tapOn:
    id: "operator-nav-settings"
- extendedWaitUntil:
    visible: "Secret is configured on this device"
    timeout: 15000

- killApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Secret is configured on this device"
    timeout: 30000
- takeScreenshot: operator-readonly-navigation-complete
