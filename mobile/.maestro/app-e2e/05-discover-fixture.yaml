appId: com.sportreel.app
name: APP full - downstream Discover output
tags: [app-full, discover]
---
- launchApp:
    stopApp: false
- tapOn: "Exit ✕"
- extendedWaitUntil:
    visible: "${DISCOVER_SPORT}"
    timeout: 60000
- assertVisible: ".*[0-9]+h [0-9]+m.*"
- takeScreenshot: discover-fixture-visible
