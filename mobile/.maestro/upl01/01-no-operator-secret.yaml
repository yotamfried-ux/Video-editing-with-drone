# Negative: a selected video must not upload without the operator secret.
# Expected semantics: operatorFetch refuses before any network call, the item
# ends Failed with the specific "Operator secret not set" reason, and (checked
# by the backend verifier) no source_uploads row is created.
appId: com.sportreel.app
name: UPL-01 negative - no operator secret
tags: [upl01, negative]
---
- runFlow: subflows/launch-to-settings.yaml
- assertVisible: "No secret — operator actions are disabled"
- runFlow: subflows/open-pipeline.yaml
- tapOn:
    id: "pipeline-upload-gallery"
- runFlow: subflows/pick-first-video.yaml
- extendedWaitUntil:
    visible: "Some uploads failed|Uploaded to queue|Operator secret required|Failed"
    timeout: 60000
- takeScreenshot: no-secret-terminal-alert
- assertVisible: "Some uploads failed"
- assertNotVisible: "Uploaded to queue"
- tapOn: "(?i)ok"
- scrollUntilVisible:
    element:
      id: "upload-item-status-failed"
    direction: DOWN
    timeout: 30000
    centerElement: true
- assertVisible:
    id: "upload-item-status-failed"
    text: ".*Operator secret not set.*"
- assertNotVisible:
    id: "upload-item-status-verified"
