# The secret comes only from the runner environment (MAESTRO_OPERATOR_SECRET),
# never from this repository.
appId: com.sportreel.app
---
- tapOn:
    id: "operator-secret-input"
- inputText: ${MAESTRO_OPERATOR_SECRET}
- hideKeyboard
- tapOn:
    id: "operator-secret-save"
- extendedWaitUntil:
    visible: "Secret is configured on this device"
    timeout: 15000
