# Android 13+ system Photo Picker (expo-image-picker multi-select). It is a
# system component, so target its resource ids (Google or AOSP MediaProvider
# module) as in the official Maestro gallery recipe — never coordinates.
appId: com.sportreel.app
---
- extendedWaitUntil:
    visible:
      id: ".*providers\\.media\\.module:id/icon_thumbnail"
    timeout: 30000
- takeScreenshot: photo-picker
- tapOn:
    id: ".*providers\\.media\\.module:id/icon_thumbnail"
    index: 0
- runFlow:
    when:
      visible:
        id: ".*providers\\.media\\.module:id/button_add"
    commands:
      - tapOn:
          id: ".*providers\\.media\\.module:id/button_add"
