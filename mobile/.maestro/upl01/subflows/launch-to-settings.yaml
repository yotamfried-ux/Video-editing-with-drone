# Cold-launch with wiped app data (clears the SecureStore operator secret).
# The UPL-01 validation build redirects the entry route to operator Settings.
appId: com.sportreel.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Operator Secret|Pixel Launcher isn't responding"
    timeout: 180000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
      - launchApp:
          stopApp: false
- extendedWaitUntil:
    visible: "Operator Secret"
    timeout: 60000
