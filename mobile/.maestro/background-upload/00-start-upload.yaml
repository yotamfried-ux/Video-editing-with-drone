# Starts one multi-video stable-batch upload through the real UI (operator secret, Pipeline,
# SD / USB folder picker, select all, upload). Leaves the app uploading in the background worker.
appId: com.sportreel.app
name: Background upload - start multi-video batch
tags: [background-upload, start]
---
- runFlow: ../upl01/subflows/launch-to-settings.yaml
- runFlow: ../upl01/subflows/save-operator-secret.yaml
- tapOn: "Pipeline"
- scrollUntilVisible:
    element:
      id: "pipeline-upload-external"
    direction: DOWN
    timeout: 60000
    centerElement: true
- tapOn:
    id: "pipeline-upload-external"
- runFlow: subflows/pick-sd-folder.yaml
# System "isn't responding" dialogs on a loaded emulator must not mask the app flow (same handling as UPL-01).
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- runFlow:
    when:
      visible: "(?i)(sportreel|system ui|google play services) isn't responding"
    commands:
      - tapOn: "(?i)wait"
- extendedWaitUntil:
    visible:
      id: "pipeline-external-select-all"
    timeout: 90000
- takeScreenshot: candidates-listed
- tapOn:
    id: "pipeline-external-select-all"
- tapOn:
    id: "pipeline-upload-selected"
- extendedWaitUntil:
    visible: "Uploading in the background"
    timeout: 60000
- takeScreenshot: handed-off-to-worker
- tapOn: "(?i)ok"
- scrollUntilVisible:
    element:
      id: "upload-batch-summary"
    direction: DOWN
    timeout: 30000
    centerElement: true
- takeScreenshot: progress-visible
