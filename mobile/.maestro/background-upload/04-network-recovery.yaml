# While the network is down the UI must say the upload is waiting, not failed, and keep the batch
# gated; after the network returns the worker resumes on its own (asserted by the runner).
appId: com.sportreel.app
name: Background upload - network outage shows waiting state, never failed
tags: [background-upload, network]
---
- launchApp:
    stopApp: false
- runFlow: subflows/open-pipeline-progress.yaml
- assertNotVisible:
    id: "upload-item-status-failed"
- assertVisible:
    id: "pipeline-run"
    enabled: false
- takeScreenshot: network-outage-waiting
